<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finanças</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --ink: #1f2430; --muted: #7d8494; --line: #e7eaf0;
    --acc: #2450b8; --acc-2: #3f6fe0; --acc-bg: #e2e9fb; --accent-ink: #ffffff;
    --green: #2f8a5b; --green-bg: #e3f2e9; --red: #c2402f; --red-bg: #fbe8e5;
    --shadow: 0 2px 12px rgba(20, 35, 70, .07); --r: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 4px 16px 110px; }

  .topo { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px 6px; }
  .mesnav { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .mesnav .mes { font-size: 19px; font-weight: 700; text-align: center; flex: 1; }
  .mesnav .mes small { color: var(--muted); font-weight: 500; font-size: 15px; }
  .nav { width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--card); box-shadow: var(--shadow);
    font-size: 20px; color: var(--acc); cursor: pointer; }
  .nav:disabled { opacity: .3; }

  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin: 12px 0; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 a { font-size: 13px; font-weight: 600; color: var(--acc); cursor: pointer; }

  .hero { text-align: center; padding: 18px 16px 16px; }
  .hero .rot { color: var(--muted); font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .olho { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; display: inline-flex; }
  .hero .saldo { font-size: 32px; font-weight: 750; letter-spacing: -.5px; margin: 2px 0 14px; }
  .hero .saldo.neg { color: var(--red); }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .duas div { display: flex; align-items: center; gap: 10px; }
  .duas small { display: block; color: var(--muted); font-size: 12px; }
  .duas b { font-size: 15px; }
  .bola { width: 38px; height: 38px; border-radius: 19px; display: inline-flex; align-items: center; justify-content: center;
    flex: none; font-size: 18px; }
  .bola.up { background: var(--green); color: #fff; } .bola.down { background: var(--red); color: #fff; }
  .verde { color: var(--green); } .vermelho { color: var(--red); }

  .barraprog { height: 8px; border-radius: 4px; background: var(--acc-bg); overflow: hidden; margin: 10px 0 8px; }
  .barraprog i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc-2)); border-radius: 4px; }
  .linhaprog { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .alerta { margin-top: 10px; font-size: 13px; color: var(--red); background: var(--red-bg); border-radius: 10px; padding: 8px 10px; cursor: pointer; }

  .rosca { display: flex; align-items: center; gap: 16px; }
  .rosca svg { flex: none; }
  .legenda { flex: 1; min-width: 0; }
  .legenda div { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .legenda span.ponto { width: 10px; height: 10px; border-radius: 5px; flex: none; }
  .legenda span.nome { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 5px 13px;
    white-space: nowrap; cursor: pointer; font-size: 13px; color: var(--muted); }
  .chip.on { background: var(--acc); color: var(--accent-ink); border-color: var(--acc); }

  .dia { font-size: 14px; font-weight: 700; margin: 18px 4px 6px; }
  .dia small { color: var(--muted); font-weight: 500; }
  .lista { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .card .lista { box-shadow: none; border-radius: 0; margin: 0 -16px -16px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .ico { width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 19px; flex: none; }
  .item .txt { flex: 1; min-width: 0; }
  .item .nome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 14.5px; }
  .item .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .val { text-align: right; white-space: nowrap; font-weight: 650; font-size: 14.5px; }
  .item .val .sub { font-weight: 400; }
  .estado { display: block; font-size: 11px; font-weight: 600; margin-top: 2px; }
  .estado.ok { color: var(--green); } .estado.venc { color: var(--red); } .estado.ab { color: var(--muted); font-weight: 500; }
  .item.pago .nome { color: var(--muted); }
  .vazio { padding: 14px; color: var(--muted); text-align: center; }

  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -2px 14px rgba(20,35,70,.08);
    display: flex; justify-content: space-around; align-items: center; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 6; }
  .barra button { background: none; border: 0; color: var(--muted); font-size: 11px; padding: 4px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; }
  .barra button svg { width: 22px; height: 22px; }
  .barra button.on { color: var(--acc); font-weight: 600; }
  .barra button:disabled { opacity: .45; }
  .barra .mais { width: 56px; height: 56px; min-width: 56px; border-radius: 28px; background: linear-gradient(135deg, var(--acc-2), var(--acc));
    color: #fff; font-size: 30px; line-height: 1; margin-top: -30px; box-shadow: 0 4px 14px rgba(36,80,184,.4); }

  .fundo { position: fixed; inset: 0; background: rgba(15,20,35,.35); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .fundo.on { display: flex; }
  .folha { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .folha h3 { margin: 0 0 4px; font-size: 18px; }
  .folha .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .campo { margin: 10px 0; }
  .campo label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .campo input, .campo select, .campo textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dados { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 8px 0; }
  .dados span:nth-child(odd) { color: var(--muted); }
  .btn { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    cursor: pointer; margin-top: 8px; font-weight: 600; }
  .btn.pri { background: linear-gradient(135deg, var(--acc-2), var(--acc)); color: #fff; border-color: var(--acc); }
  .btn.perigo { color: var(--red); }
  .btn:disabled { opacity: .5; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { flex: 1; padding: 9px; border: 0; background: var(--bg); cursor: pointer; }
  .seg button.on { background: var(--acc); color: #fff; }
  .check { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  .check input { width: 20px; height: 20px; accent-color: var(--acc); }
  .links a { display: block; color: var(--acc); margin: 2px 0; }
  .aviso { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .login { text-align: center; padding: 60px 0; }
  .login .marca { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--acc-2), var(--acc)); color: #fff; font-weight: 800; font-size: 26px; }
  .login #botaoGoogle { display: inline-block; margin-top: 10px; min-height: 44px; }
  .rodape { text-align: center; color: var(--muted); font-size: 12px; margin: 22px 0 8px; }
  .rodape button { background: none; border: 0; color: var(--acc); text-decoration: underline; cursor: pointer; padding: 0 4px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 9px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }
  .carregando { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--acc); transform: scaleX(0);
    transform-origin: left; transition: transform .3s; z-index: 30; }
  .carregando.on { transform: scaleX(.8); transition: transform 4s; }
  .erro { background: var(--red-bg); color: var(--red); padding: 12px; border-radius: 12px; margin: 16px 0; }
</style>
</head>
<body>
<div class="carregando" id="carregando"></div>
<div class="topo"><div class="mesnav">
  <button class="nav" id="ant" aria-label="Mês anterior">‹</button>
  <div class="mes" id="titulo">Finanças</div>
  <button class="nav" id="prox" aria-label="Próximo mês">›</button>
</div></div>
<div class="wrap"><div id="conteudo"><p class="vazio">Carregando…</p></div></div>

<nav class="barra">
  <button class="on" data-aba="principal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Principal</span></button>
  <button data-aba="transacoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Transações</span></button>
  <button class="mais" id="btnNovo" aria-label="Novo lançamento">+</button>
  <button disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Resumo</span></button>
  <button disabled><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>Mais</span></button>
</nav>

<div class="fundo" id="fundo"><div class="folha" id="folha"></div></div>
<div class="toast" id="toast"></div>

<script>
window.onerror =(msg, src, linha) => { document.getElementById('conteudo').insertAdjacentHTML('beforeend', `<div class="erro">Erro na tela: ${msg} (linha ${linha})</div>`); };
window.addEventListener('unhandledrejection', e => { document.getElementById('conteudo').insertAdjacentHTML('beforeend', `<div class="erro">Erro: ${(e.reason && e.reason.message) || e.reason}</div>`); });
</script>
<script>
// Servidor = Apps Script publicado como API; login = "Entrar com Google" (ID token), conferido no servidor.
const API = 'https://script.google.com/macros/s/AKfycbwcof9mClbEJ8aW3iwMsk7rkNIlT2NVMCO2H2WpSdItzOM5l-_-7vPhAMx12olSxji1zA/exec';
const CLIENT_ID = '761338018924-50mt0begrbrlfpl5dg6g81rvdmghf89n.apps.googleusercontent.com';
const ACEITA = 'image/' + '*,application/pdf';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const st = { pessoa: 'Todos', situacao: 'Todos' };
const $ = id => document.getElementById(id);

// ---------- login ----------

// A sessão (30 dias) fica guardada neste aparelho; o "Entrar com Google" só aparece no primeiro acesso ou depois de sair.
const guardar = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
let SESSAO = ler('fin_sessao');

function mostrarLogin(msg) {
  SESSAO = null; guardar('fin_sessao', null);
  $('titulo').textContent = 'Finanças';
  $('conteudo').innerHTML = `<div class="login"><div class="marca">R$</div><p>Entre com a sua conta Google.</p>${msg ? `<div class="erro">${esc(msg)}</div>` : ''}<div id="botaoGoogle"></div></div>`;
  desenharBotao();
}
function desenharBotao() {
  if ($('botaoGoogle') && window.google && google.accounts) {
    google.accounts.id.renderButton($('botaoGoogle'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', locale: 'pt-BR' });
  }
}

// Chamado pelo script do Google (gsi/client) quando termina de carregar.
function gisPronto() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => entrar(r.credential) });
  desenharBotao();
}

async function entrar(idToken) {
  try {
    const d = await post({ acao: 'entrar', idToken });
    SESSAO = d.sessao; guardar('fin_sessao', SESSAO);
    carregarTudo();
  } catch (e) { mostrarLogin(e.message); }
}

function sair() {
  mostrarLogin();
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
}

// ---------- servidor ----------

async function post(corpo) {
  $('carregando').classList.add('on');
  const espera = setTimeout(() => toast('O servidor está demorando…'), 15000);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(corpo) });
    const j = await r.json();
    if (!j.ok) { const e = new Error(j.erro); e.login = j.login; throw e; }
    return j.dados;
  } finally { clearTimeout(espera); $('carregando').classList.remove('on'); }
}

async function call(acao, ...args) {
  if (!SESSAO) { mostrarLogin(); throw new Error('Faça login'); }
  try { return await post({ sessao: SESSAO, acao, args }); }
  catch (e) { if (e.login) mostrarLogin(e.message); throw e; }
}
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const usd = n => 'US$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dataBR = s => (s && /^\d{4}-\d{2}-\d{2}/.test(s)) ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const nomeMes = m => MESES[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const numero = s => { s = String(s).trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); };
const quemCurto = e => !e ? '' : e === st.usuario ? 'você' : e.split('@')[0];

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2500); }
function erro(e) { toast((e && e.message) || String(e)); }

// Busca o banco inteiro uma vez; trocar de mês é local. Recarrega ao voltar para o app (pega o que a outra pessoa lançou).
let carregadoEm = 0;
async function carregarTudo() {
  try {
    const d = await call('carregar');
    Object.assign(st, d);
    if (!st.mes || st.meses.indexOf(st.mes) < 0) {
      const atual = st.hoje.slice(0, 7);
      st.mes = st.meses.indexOf(atual) >= 0 ? atual : st.meses[st.meses.length - 1];
    }
    carregadoEm = Date.now();
    render();
  } catch (e) {
    if (!$('botaoGoogle')) $('conteudo').innerHTML = `<div class="erro">Não consegui abrir o banco de dados.<br><small>${esc(e.message || e)}</small></div>`;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && SESSAO && carregadoEm && Date.now() - carregadoEm > 60000 && !$('fundo').classList.contains('on')) carregarTudo();
});

function abrirMes(mes) { st.mes = mes; render(); window.scrollTo(0, 0); }

function filtrados() {
  return st.itens.filter(i => i.mes === st.mes && (st.pessoa === 'Todos' || i.pessoa === st.pessoa));
}

// ---------- telas ----------

const CAT = {
  'Cartões de Crédito': ['💳', '#efe6d2'], 'Contas (água/luz/internet)': ['💡', '#fdf1cf'], 'Dívidas/Parcelas': ['🧾', '#ece7f6'],
  'Educação': ['🎓', '#e3edf7'], 'Empresa': ['💼', '#e8e6e1'], 'Impostos': ['🏛️', '#ebe9e4'], 'Investimentos': ['📈', '#e3f2e9'],
  'Lazer': ['🎉', '#fbe8ef'], 'Mercado': ['🛒', '#e6f3e4'], 'Moradia': ['🏠', '#f6e9dc'], 'Outros': ['📌', '#eeece7'],
  'Pets': ['🐾', '#f3ebe0'], 'Presentes': ['🎁', '#fbe8e5'], 'Saúde': ['🩺', '#e3f0f2'], 'Transporte': ['🚗', '#e5ebf5'], 'Viagens': ['✈️', '#e3eef8'],
};
const CORES = ['#e0892f', '#2a9d8f', '#8e6bbf', '#c9a227', '#d16ba5', '#9aa0a6'];
const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
st.aba = 'principal';
st.oculto = ler('fin_oculto') === '1';
const m = n => st.oculto ? 'R$ ••••' : brl(n);
const icone = i => {
  const [e, bg] = i.tipo === 'Receita' ? ['💰', '#e3f2e9'] : (CAT[i.categoria] || ['📌', '#eeece7']);
  return `<span class="ico" style="background:${bg}">${e}</span>`;
};
const OLHO = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>${'{X}'}</svg>`;

function render() {
  const [ano, mm] = st.mes.split('-');
  $('titulo').innerHTML = `${MESES[Number(mm) - 1]} <small>${ano}</small>`;
  const k = st.meses.indexOf(st.mes);
  $('ant').disabled = k <= 0; $('prox').disabled = k >= st.meses.length - 1;
  document.querySelectorAll('[data-aba]').forEach(b => b.classList.toggle('on', b.dataset.aba === st.aba));
  const chipsPessoa = `<div class="chips">${['Todos'].concat(st.cad['Pessoas'] || []).map(p => `<button class="chip ${p === st.pessoa ? 'on' : ''}" data-pessoa="${esc(p)}">${esc(p)}</button>`).join('')}</div>`;
  let h = chipsPessoa + (st.aba === 'principal' ? telaPrincipal() : telaTransacoes());
  h += `<p class="rodape">Conectado como ${esc(st.usuario)}<button onclick="sair()">Sair</button></p>`;
  $('conteudo').innerHTML = h;
  document.querySelectorAll('[data-pessoa]').forEach(b => b.onclick = () => { st.pessoa = b.dataset.pessoa; render(); });
  document.querySelectorAll('[data-sit]').forEach(b => b.onclick = () => { st.situacao = b.dataset.sit; render(); });
  document.querySelectorAll('.item').forEach(el => el.onclick = () => detalhe(el.dataset.id));
  document.querySelectorAll('[data-ir]').forEach(el => el.onclick = () => { st.aba = 'transacoes'; st.situacao = el.dataset.ir; render(); window.scrollTo(0, 0); });
  if ($('olho')) $('olho').onclick = () => { st.oculto = !st.oculto; guardar('fin_oculto', st.oculto ? '1' : '0'); render(); };
}

function totais(itens) {
  const soma = f => itens.filter(f).reduce((s, i) => s + (Number(i.valor_brl) || 0), 0);
  const desp = soma(i => i.tipo === 'Despesa'), pago = soma(i => i.tipo === 'Despesa' && i.pago);
  const abertas = itens.filter(i => i.tipo === 'Despesa' && !i.pago && Number(i.valor_brl) > 0);
  return { rec: soma(i => i.tipo === 'Receita'), desp, pago, abertas, vencidas: abertas.filter(vencida) };
}
const vencida = i => !i.pago && i.vencimento && i.vencimento < st.hoje && i.tipo === 'Despesa' && Number(i.valor_brl) > 0;

function telaPrincipal() {
  const itens = filtrados();
  const t = totais(itens);
  const saldo = t.rec - t.desp;
  const pct = t.desp ? Math.round(100 * t.pago / t.desp) : 0;
  let h = `
    <div class="card hero">
      <div class="rot">Saldo do mês <button class="olho" id="olho" aria-label="Mostrar ou esconder valores">${OLHO.replace('{X}', st.oculto ? '<path d="M3 3l18 18"/>' : '')}</button></div>
      <div class="saldo ${saldo < 0 ? 'neg' : ''}">${m(saldo)}</div>
      <div class="duas">
        <div><span class="bola up">↑</span><span><small>Receitas</small><b class="verde">${m(t.rec)}</b></span></div>
        <div><span class="bola down">↓</span><span><small>Despesas</small><b class="vermelho">${m(t.desp)}</b></span></div>
      </div>
    </div>
    <div class="card">
      <h2>Contas do mês <a data-ir="A pagar">Ver a pagar</a></h2>
      <div class="linhaprog"><span><b style="color:var(--ink)">${m(t.pago)}</b> pagos</span><span>${pct}%</span></div>
      <div class="barraprog"><i style="width:${pct}%"></i></div>
      <div class="linhaprog"><span>Faltam ${m(t.desp - t.pago)}</span><span>${t.abertas.length} ${t.abertas.length === 1 ? 'conta aberta' : 'contas abertas'}</span></div>
      ${t.vencidas.length ? `<div class="alerta" data-ir="A pagar">${t.vencidas.length} ${t.vencidas.length === 1 ? 'conta vencida' : 'contas vencidas'}: ${esc(t.vencidas.map(i => i.item).slice(0, 3).join(', '))}${t.vencidas.length > 3 ? '…' : ''}</div>` : ''}
    </div>`;

  const prox = t.abertas.slice().sort((a, b) => (a.vencimento || '9999').localeCompare(b.vencimento || '9999')).slice(0, 4);
  if (prox.length) h += `<div class="card"><h2>Próximos vencimentos <a data-ir="A pagar">Ver todos</a></h2><div class="lista">${prox.map(linha).join('')}</div></div>`;

  const porCat = {};
  itens.filter(i => i.tipo === 'Despesa').forEach(i => (porCat[i.categoria || 'Outros'] = (porCat[i.categoria || 'Outros'] || 0) + (Number(i.valor_brl) || 0)));
  let cats = Object.entries(porCat).filter(c => c[1] > 0).sort((a, b) => b[1] - a[1]);
  if (cats.length > 5) cats = cats.slice(0, 5).concat([['Outras', cats.slice(5).reduce((s, c) => s + c[1], 0)]]);
  if (cats.length) h += `<div class="card"><h2>Despesas por categoria</h2><div class="rosca">${rosca(cats)}<div class="legenda">${cats.map((c, n) => `<div><span class="ponto" style="background:${CORES[n % CORES.length]}"></span><span class="nome">${esc(c[0])}</span><b>${m(c[1])}</b></div>`).join('')}</div></div></div>`;

  const cartoes = itens.filter(i => i.categoria === 'Cartões de Crédito' && i.tipo === 'Despesa').sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || ''));
  if (cartoes.length) h += `<div class="card"><h2>Cartões de crédito</h2><div class="lista">${cartoes.map(linha).join('')}</div></div>`;
  return h;
}

function rosca(cats) {
  const total = cats.reduce((s, c) => s + c[1], 0), R = 44, C = 2 * Math.PI * R;
  let acum = 0;
  const arcos = cats.map((c, n) => {
    const len = C * c[1] / total;
    const a = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${CORES[n % CORES.length]}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acum}" transform="rotate(-90 60 60)"/>`;
    acum += len; return a;
  }).join('');
  return `<svg width="120" height="120" viewBox="0 0 120 120">${arcos}<text x="60" y="57" text-anchor="middle" font-size="10" fill="#7d8494">Total</text><text x="60" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2430">${st.oculto ? '••••' : (total / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil'}</text></svg>`;
}

function telaTransacoes() {
  const itens = filtrados();
  const ok = i => st.situacao === 'Todos' || (st.situacao === 'Pagos' ? i.pago : !i.pago);
  const lista = itens.filter(ok).sort((a, b) => (a.vencimento || '9999').localeCompare(b.vencimento || '9999') || (a.tipo === 'Receita' ? -1 : 1));
  const t = totais(itens);
  let h = `<div class="chips">${['Todos', 'A pagar', 'Pagos'].map(p => `<button class="chip ${p === st.situacao ? 'on' : ''}" data-sit="${esc(p)}">${esc(p)}</button>`).join('')}</div>
    <div class="card" style="display:flex;justify-content:space-around;text-align:center;padding:12px">
      <div><small style="color:var(--muted)">Receitas</small><br><b class="verde">${m(t.rec)}</b></div>
      <div><small style="color:var(--muted)">Despesas</small><br><b class="vermelho">${m(t.desp)}</b></div>
      <div><small style="color:var(--muted)">A pagar</small><br><b>${m(t.desp - t.pago)}</b></div>
    </div>`;
  if (!lista.length) return h + '<p class="vazio">Nada aqui com esses filtros.</p>';
  const grupos = [];
  lista.forEach(i => { const d = i.vencimento || ''; const g = grupos[grupos.length - 1]; if (g && g.d === d) g.itens.push(i); else grupos.push({ d, itens: [i] }); });
  const amanha = new Date(st.hoje + 'T12:00:00'); amanha.setDate(amanha.getDate() + 1);
  const amanhaS = amanha.toISOString().slice(0, 10);
  grupos.forEach(g => {
    let rot = 'Sem data';
    if (g.d) {
      const dt = new Date(g.d + 'T12:00:00');
      rot = g.d === st.hoje ? 'Hoje' : g.d === amanhaS ? 'Amanhã' : DIAS[dt.getDay()];
      rot += ` <small>${dataBR(g.d)}</small>`;
    }
    h += `<div class="dia">${rot}</div><div class="lista">${g.itens.map(linha).join('')}</div>`;
  });
  return h;
}

function linha(i) {
  const rec = i.tipo === 'Receita';
  const estado = i.pago ? `<span class="estado ok">✓ ${rec ? 'recebido' : 'pago'}</span>`
    : vencida(i) ? '<span class="estado venc">vencida</span>'
    : i.vencimento ? `<span class="estado ab">${rec ? 'a receber' : 'vence'} ${dataBR(i.vencimento)}</span>` : '';
  const sub = [i.categoria, i.pessoa, i.parcela].filter(Boolean).join(' · ');
  const valor = i.moeda === 'USD' && !st.oculto ? `${usd(i.valor)}<span class="sub" style="display:block">${brl(i.valor_brl)}</span>` : m(i.valor_brl);
  return `<div class="item ${i.pago ? 'pago' : ''}" data-id="${esc(i.id)}">${icone(i)}
    <div class="txt"><div class="nome">${esc(i.item)}${i.comprovante ? ' 📎' : ''}</div><div class="sub">${esc(sub)}</div></div>
    <div class="val ${rec ? 'verde' : ''}">${valor}${estado}</div></div>`;
}

// ---------- folha (detalhe e novo) ----------

function abrirFolha(html) { $('folha').innerHTML = html; $('fundo').classList.add('on'); }
function fecharFolha() { $('fundo').classList.remove('on'); }
$('fundo').onclick = e => { if (e.target === $('fundo')) fecharFolha(); };

function atualizarItem(novo) {
  const k = st.itens.findIndex(i => i.id === novo.id);
  if (k >= 0) st.itens[k] = novo; else st.itens.push(novo);
  render();
}

function detalhe(id) {
  const i = st.itens.find(x => x.id === id);
  const receita = i.tipo === 'Receita';
  const links = String(i.comprovante || '').split('\n').filter(Boolean);
  const temOverride = i.valor_mes !== '' && i.valor_mes !== null;
  abrirFolha(`
    <h3>${esc(i.item)}</h3>
    <div class="sub">${esc(i.tipo)} · ${esc(i.pessoa)} · ${esc(i.categoria)}</div>
    <div class="dados">
      ${i.vencimento ? `<span>${receita ? 'Data' : 'Vencimento'}</span><span>${dataBR(i.vencimento)}/${i.vencimento.slice(0, 4)}</span>` : ''}
      ${i.parcela ? `<span>Parcela</span><span>${esc(i.parcela)}</span>` : ''}
      ${i.forma_pgto ? `<span>Forma</span><span>${esc(i.forma_pgto)}</span>` : ''}
      <span>Previsto</span><span>${i.moeda === 'USD' ? usd(i.valor_previsto) : brl(i.valor_previsto)}</span>
      <span>Valor do mês</span><span><b>${i.moeda === 'USD' ? usd(i.valor) + ' = ' + brl(i.valor_brl) : brl(i.valor_brl)}</b></span>
      ${i.pago ? `<span>${receita ? 'Recebido' : 'Pago'}</span><span>${dataBR(i.pago_em)}${i.pago_por ? ' por ' + esc(quemCurto(i.pago_por)) : ''}</span>` : ''}
    </div>
    <button class="btn pri" id="bPago">${i.pago ? 'Desfazer ' + (receita ? 'recebido' : 'pago') : 'Marcar como ' + (receita ? 'recebido' : 'pago')}</button>

    <div class="campo"><label>Valor deste mês ${i.moeda === 'USD' ? '(US$)' : '(R$)'}${temOverride ? '' : ', vazio = previsto'}</label>
      <div class="linha2"><input id="vMes" inputmode="decimal" value="${temOverride ? String(i.valor_mes).replace('.', ',') : ''}" placeholder="${String(i.valor_previsto).replace('.', ',')}">
      <button class="btn" id="bValor" style="margin:0">Salvar valor</button></div></div>

    <div class="campo"><label>Comprovante</label>
      <div class="links">${links.map((l, n) => `<a href="${esc(l)}" target="_blank">Abrir comprovante${links.length > 1 ? ' ' + (n + 1) : ''}</a>`).join('')}</div>
      <input type="file" id="arq" accept="${ACEITA}"></div>

    <div class="campo"><label>Observação</label><textarea id="obs" rows="3">${esc(i.obs)}</textarea>
      <button class="btn" id="bObs">Salvar observação</button></div>

    ${i.origem === 'extra' ? '<button class="btn perigo" id="bExcluir">Excluir lançamento</button>' : ''}
    <div class="aviso">${i.criado_por ? 'Criado por ' + esc(quemCurto(i.criado_por)) + (i.criado_em ? ' em ' + esc(i.criado_em) : '') : ''}${i.alterado_por ? '. Alterado por ' + esc(quemCurto(i.alterado_por)) + ' em ' + esc(i.alterado_em) : ''}</div>
    <button class="btn" onclick="fecharFolha()">Fechar</button>`);

  const trava = async (botao, acao, msg) => {
    botao.disabled = true;
    try { const novo = await acao(); if (novo) { atualizarItem(novo); detalhe(novo.id); } toast(msg); }
    catch (e) { erro(e); botao.disabled = false; }
  };
  // Pago muda na tela na hora; o servidor grava por trás e, se falhar, a tela volta ao que era.
  $('bPago').onclick = () => {
    const antes = Object.assign({}, i);
    const pago = !i.pago;
    atualizarItem(Object.assign({}, i, { pago, pago_em: pago ? st.hoje : '', pago_por: pago ? st.usuario : '' }));
    detalhe(id);
    toast(pago ? (receita ? 'Marcado como recebido' : 'Marcado como pago') : 'Desfeito');
    call('marcarPago', id, pago).then(atualizarItem).catch(err => {
      atualizarItem(antes);
      if ($('fundo').classList.contains('on') && $('bPago')) detalhe(id);
      toast('Não gravou: ' + ((err && err.message) || err));
    });
  };
  $('bValor').onclick = e => {
    const t = $('vMes').value.trim();
    if (t !== '' && !isFinite(numero(t))) return toast('Valor inválido');
    trava(e.target, () => call('definirValorMes', id, t === '' ? '' : numero(t)), 'Valor salvo');
  };
  $('bObs').onclick = e => trava(e.target, () => call('definirObs', id, $('obs').value), 'Observação salva');
  $('arq').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    e.target.disabled = true; toast('Enviando comprovante…');
    try { const { b64, mime, nome } = await prepararArquivo(f); const novo = await call('anexarComprovante', id, nome, mime, b64); atualizarItem(novo); detalhe(id); toast('Comprovante anexado'); }
    catch (err) { erro(err); e.target.disabled = false; }
  };
  if ($('bExcluir')) $('bExcluir').onclick = async e => {
    if (e.target.dataset.conf !== '1') { e.target.dataset.conf = '1'; e.target.textContent = 'Toque de novo para excluir'; return; }
    e.target.disabled = true;
    try { await call('excluirLancamento', id); st.itens = st.itens.filter(x => x.id !== id); render(); fecharFolha(); toast('Excluído'); }
    catch (err) { erro(err); e.target.disabled = false; }
  };
}

// Foto do celular é reduzida para no máximo 1600 px antes de subir; PDF vai como está.
function prepararArquivo(f) {
  return new Promise((ok, falha) => {
    if (/^image\/(jpeg|png|webp|heic|heif)/.test(f.type)) {
      const img = new Image();
      img.onload = () => {
        const fator = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * fator); c.height = Math.round(img.height * fator);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ b64: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg', nome: 'comprovante.jpg' });
      };
      img.onerror = () => lerCru(f).then(ok, falha);
      img.src = URL.createObjectURL(f);
    } else lerCru(f).then(ok, falha);
  });
}
function lerCru(f) {
  return new Promise((ok, falha) => {
    if (f.size > 20 * 1024 * 1024) return falha(new Error('Arquivo maior que 20 MB'));
    const r = new FileReader();
    r.onload = () => ok({ b64: r.result.split(',')[1], mime: f.type || 'application/octet-stream', nome: f.name });
    r.onerror = () => falha(r.error); r.readAsDataURL(f);
  });
}

function novo() {
  const hojeNoMes = st.hoje.slice(0, 7) === st.mes ? st.hoje : st.mes + '-01';
  const opts = (lista, sel) => lista.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const formas = (st.cad['Forma Pgto'] || []).filter(f => f !== 'Crédito');
  abrirFolha(`
    <h3>Novo lançamento</h3>
    <div class="seg" id="tipo"><button class="on" data-v="Despesa">Despesa</button><button data-v="Receita">Receita</button></div>
    <div class="campo"><label>Item</label><input id="nItem" placeholder="Ex.: Farmácia, conserto, presente"></div>
    <div class="linha2">
      <div class="campo"><label>Valor</label><input id="nValor" inputmode="decimal" placeholder="0,00"></div>
      <div class="campo"><label>Moeda</label><select id="nMoeda">${opts(st.cad['Moeda'] || ['BRL'], 'BRL')}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Data</label><input id="nData" type="date" value="${hojeNoMes}"></div>
      <div class="campo"><label>Mês da planilha</label><select id="nMes">${st.meses.map(m => `<option value="${m}" ${m === st.mes ? 'selected' : ''}>${nomeMes(m)}</option>`).join('')}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Pessoa</label><select id="nPessoa">${opts(st.cad['Pessoas'] || [], 'Gerais')}</select></div>
      <div class="campo"><label>Forma</label><select id="nForma">${opts(formas, 'PIX')}</select></div>
    </div>
    <div class="campo"><label>Categoria</label><select id="nCat">${opts(st.cad['Categorias'] || [], 'Outros')}</select></div>
    <div class="aviso">Compra no cartão de crédito não entra aqui: ela vem pela fatura do cartão.</div>
    <label class="check"><input type="checkbox" id="nPago" checked> Já está pago</label>
    <div class="campo"><label>Comprovante (opcional)</label><input type="file" id="nArq" accept="${ACEITA}"></div>
    <div class="campo"><label>Observação (opcional)</label><textarea id="nObs" rows="2"></textarea></div>
    <button class="btn pri" id="bSalvar">Salvar</button>
    <button class="btn" onclick="fecharFolha()">Cancelar</button>`);
  let tipo = 'Despesa';
  document.querySelectorAll('#tipo button').forEach(b => b.onclick = () => {
    tipo = b.dataset.v; document.querySelectorAll('#tipo button').forEach(x => x.classList.toggle('on', x === b));
    $('nPago').parentNode.lastChild.textContent = tipo === 'Receita' ? ' Já foi recebido' : ' Já está pago';
  });
  $('bSalvar').onclick = async e => {
    const valor = numero($('nValor').value);
    if (!$('nItem').value.trim()) return toast('Preencha o item');
    if (!isFinite(valor) || $('nValor').value.trim() === '') return toast('Valor inválido');
    e.target.disabled = true;
    try {
      let o = await call('criarLancamento', {
        tipo, item: $('nItem').value.trim(), valor, moeda: $('nMoeda').value, data: $('nData').value, mes: $('nMes').value,
        pessoa: $('nPessoa').value, forma_pgto: $('nForma').value, categoria: $('nCat').value, pago: $('nPago').checked, obs: $('nObs').value.trim(),
      });
      const f = $('nArq').files[0];
      if (f) { toast('Enviando comprovante…'); const a = await prepararArquivo(f); o = await call('anexarComprovante', o.id, a.nome, a.mime, a.b64); }
      fecharFolha();
      st.mes = o.mes; atualizarItem(o);
      toast('Lançado');
    } catch (err) { erro(err); e.target.disabled = false; }
  };
}

$('btnNovo').onclick = novo;
document.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { st.aba = b.dataset.aba; render(); window.scrollTo(0, 0); });
$('ant').onclick = () => abrirMes(st.meses[st.meses.indexOf(st.mes) - 1]);
$('prox').onclick = () => abrirMes(st.meses[st.meses.indexOf(st.mes) + 1]);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (SESSAO) carregarTudo(); else mostrarLogin();
</script>

      trocarRec(res.rec);
      st.itens = st.itens.concat(res.itens);
      render(); detalheRec(res.rec.id);
      toast(`Criada em ${res.itens.length} ${res.itens.length === 1 ? 'mês' : 'meses'}`);
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Criar'; }
  };
}

// ---------- resumo do ano ----------

const anosDoApp = () => [...new Set(st.meses.map(m => m.slice(0, 4)))];
const anoResumo = () => (st.anoResumo && anosDoApp().includes(st.anoResumo) ? st.anoResumo : st.mes.slice(0, 4));
function trocarAno(d) { const a = anosDoApp(), k = a.indexOf(anoResumo()) + d; if (a[k]) { st.anoResumo = a[k]; render(); } }
const milhar = n => (st.oculto ? '••••' : Math.round(n).toLocaleString('pt-BR'));
const curto = n => (Math.abs(n) >= 1000 ? (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil' : Math.round(n).toLocaleString('pt-BR'));
const COR_REC = '#2f8a5b', COR_DESP = '#c2402f';

// Receitas e despesas de cada mês do ano (respeita o filtro de pessoa); acumulado começa em janeiro.
function serieAno(ano) {
  let acum = 0;
  return st.meses.filter(m => m.startsWith(ano)).map(mes => {
    const t = totais(st.itens.filter(i => i.mes === mes && (st.pessoa === 'Todos' || i.pessoa === st.pessoa)));
    acum += t.rec - t.desp;
    return { mes, rec: t.rec, desp: t.desp, saldo: t.rec - t.desp, acum };
  });
}

// Topo da barra arredondado e base reta no eixo.
function barra(x, y0, w, v, esc) {
  const h = Math.abs(v) * esc; if (h < 0.5) return '';
  const r = Math.min(3, w / 2, h), y = v >= 0 ? y0 - h : y0 + h, s = v >= 0 ? 1 : -1;
  return `M${x},${y0}V${y + s * r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + s * r}V${y0}Z`;
}

function graficoMeses(serie) {
  const W = 340, H = 150, base = 128, topo = 8, esq = 30, larg = (W - esq) / 12;
  const max = Math.max(1, ...serie.flatMap(s => [s.rec, s.desp]));
  const e = (base - topo) / max, atual = st.hoje.slice(0, 7);
  const grade = [0, max / 2, max].map(v => `<line x1="${esq}" x2="${W}" y1="${base - v * e}" y2="${base - v * e}" stroke="var(--line)" stroke-width="1"/>`
    + (v ? `<text class="eixo" x="${esq - 4}" y="${base - v * e + 3}" text-anchor="end">${st.oculto ? '' : curto(v)}</text>` : '')).join('');
  const barras = serie.map((s, k) => {
    const x = esq + k * larg + larg / 2, w = Math.min(9, larg / 2 - 3);
    return `<path d="${barra(x - w - 1, base, w, s.rec, e)}" fill="${COR_REC}"/><path d="${barra(x + 1, base, w, s.desp, e)}" fill="${COR_DESP}"/>`
      + `<text class="eixo ${s.mes === atual ? 'atual' : ''}" x="${x}" y="${H - 6}" text-anchor="middle">${MESES[Number(s.mes.slice(5)) - 1][0]}</text>`;
  }).join('');
  const alvos = serie.map((s, k) => `<rect class="alvo" data-k="${k}" x="${esq + k * larg}" y="0" width="${larg}" height="${H}" rx="6"/>`).join('');
  return `<div class="graf" id="gMeses"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês">${alvos}${grade}${barras}</svg><div class="dica"></div></div>`;
}

function graficoSaldo(serie) {
  const W = 340, H = 120, larg = W / 12, atual = st.hoje.slice(0, 7);
  const max = Math.max(1, ...serie.map(s => Math.abs(s.saldo)));
  const temNeg = serie.some(s => s.saldo < 0), temPos = serie.some(s => s.saldo > 0);
  const zero = temNeg && temPos ? 52 : temNeg ? 8 : 96, e = (temNeg && temPos ? 44 : 86) / max;
  const barras = serie.map((s, k) => {
    const x = k * larg + larg / 2, w = Math.min(14, larg - 8);
    return `<path d="${barra(x - w / 2, zero, w, s.saldo, e)}" fill="${s.saldo >= 0 ? COR_REC : COR_DESP}"/>`
      + `<text class="eixo ${s.mes === atual ? 'atual' : ''}" x="${x}" y="${H - 4}" text-anchor="middle">${MESES[Number(s.mes.slice(5)) - 1][0]}</text>`;
  }).join('');
  const alvos = serie.map((s, k) => `<rect class="alvo" data-k="${k}" x="${k * larg}" y="0" width="${larg}" height="${H}" rx="6"/>`).join('');
  return `<div class="graf" id="gSaldo"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de cada mês">${alvos}<line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--muted)" stroke-width="1"/>${barras}</svg><div class="dica"></div></div>`;
}

function telaResumo() {
  const ano = anoResumo(), serie = serieAno(ano);
  st.serieResumo = serie;
  const rec = serie.reduce((t, s) => t + s.rec, 0), desp = serie.reduce((t, s) => t + s.desp, 0);
  const itensAno = st.itens.filter(i => i.mes.startsWith(ano) && (st.pessoa === 'Todos' || i.pessoa === st.pessoa));
  const porCat = {};
  itensAno.filter(i => i.tipo === 'Despesa').forEach(i => { const c = i.categoria || 'Outros'; porCat[c] = (porCat[c] || 0) + (Number(i.valor_brl) || 0); });
  const cats = Object.entries(porCat).filter(c => c[1] > 0.005).sort((a, b) => b[1] - a[1]);
  const ids = new Set(itensAno.map(i => i.id));
  const compras = (st.compras || []).filter(c => ids.has(c.lanc_id));
  const atual = st.hoje.slice(0, 7);
  let h = `
    <div class="card"><div class="tiles">
      <div><small>Receitas</small><b class="verde">${m(rec)}</b></div>
      <div><small>Despesas</small><b class="vermelho">${m(desp)}</b></div>
      <div><small>Saldo do ano</small><b class="${rec - desp < 0 ? 'vermelho' : ''}">${m(rec - desp)}</b></div>
    </div></div>
    <div class="card"><h2>Receitas e despesas</h2>
      <div class="leg"><span style="--c:${COR_REC}">Receitas</span><span style="--c:${COR_DESP}">Despesas</span></div>
      ${graficoMeses(serie)}</div>
    <div class="card"><h2>Saldo de cada mês</h2>${graficoSaldo(serie)}</div>
    <div class="card"><h2>Mês a mês</h2>
      <table class="anual"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Saldo</th><th>Acum.</th></tr></thead><tbody>
      ${serie.map(s => `<tr data-mes="${s.mes}" class="${s.mes === atual ? 'atual' : ''}"><td>${MESES[Number(s.mes.slice(5)) - 1].slice(0, 3)}</td><td>${milhar(s.rec)}</td><td>${milhar(s.desp)}</td>
        <td class="${s.saldo < 0 ? 'vermelho' : ''}">${milhar(s.saldo)}</td><td class="${s.acum < 0 ? 'vermelho' : ''}">${milhar(s.acum)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Ano</td><td>${milhar(rec)}</td><td>${milhar(desp)}</td><td class="${rec - desp < 0 ? 'vermelho' : ''}">${milhar(rec - desp)}</td><td></td></tr></tfoot></table>
      <div class="aviso">Valores em reais, sem centavos. Toque num mês para abrir. O acumulado soma os saldos a partir de janeiro.</div></div>`;
  if (cats.length) h += `<div class="card"><h2>Despesas do ano por categoria</h2>${htmlGrade(cats)}</div>`;
  if (compras.length) {
    const n = new Set(compras.map(c => c.lanc_id)).size;
    h += `<div class="card"><h2>Gastos no cartão</h2><div class="aviso" style="margin:-6px 0 4px">${n} ${n === 1 ? 'fatura importada' : 'faturas importadas'} no ano, compras por categoria</div>${htmlGrade(gradeCategorias(compras))}</div>`;
  }
  return h;
}

// Dica ao passar o dedo/mouse: mês, receitas, despesas, saldo. Linha da tabela abre o mês.
function ligarResumo() {
  ['gMeses', 'gSaldo'].forEach(id => {
    const g = $(id); if (!g) return;
    const dica = g.querySelector('.dica');
    const mostrar = el => {
      const s = st.serieResumo[Number(el.dataset.k)];
      g.querySelectorAll('.alvo').forEach(a => a.classList.toggle('on', a === el));
      dica.innerHTML = `<b>${esc(nomeMes(s.mes))}</b><br>Receitas ${m(s.rec)}<br>Despesas ${m(s.desp)}<br>Saldo ${m(s.saldo)}`;
      dica.style.display = 'block';
      const caixa = g.getBoundingClientRect(), r = el.getBoundingClientRect();
      const x = r.left - caixa.left + r.width / 2, w = dica.offsetWidth;
      dica.style.left = Math.max(0, Math.min(caixa.width - w, x - w / 2)) + 'px';
      dica.style.top = '-8px'; dica.style.transform = 'translateY(-100%)';
    };
    g.querySelectorAll('.alvo').forEach(el => { el.onpointerenter = () => mostrar(el); el.onclick = () => mostrar(el); });
    g.onpointerleave = () => { dica.style.display = 'none'; g.querySelectorAll('.alvo').forEach(a => a.classList.remove('on')); };
  });
  document.querySelectorAll('tr[data-mes]').forEach(tr => (tr.onclick = () => { st.aba = 'principal'; abrirMes(tr.dataset.mes); }));
}

function novo() {
  const hojeNoMes = st.hoje.slice(0, 7) === st.mes ? st.hoje : st.mes + '-01';
  const opts = (lista, sel) => lista.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const formas = (st.cad['Forma Pgto'] || []).filter(f => f !== 'Crédito');
  abrirFolha(`
    <h3>Novo lançamento</h3>
    <div class="seg" id="tipo"><button class="on" data-v="Despesa">Despesa</button><button data-v="Receita">Receita</button></div>
    <div class="campo"><label>Item</label><input id="nItem" placeholder="Ex.: Farmácia, conserto, presente"></div>
    <div class="linha2">
      <div class="campo"><label>Valor</label><input id="nValor" inputmode="decimal" placeholder="0,00"></div>
      <div class="campo"><label>Moeda</label><select id="nMoeda">${opts(st.cad['Moeda'] || ['BRL'], 'BRL')}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Data</label><input id="nData" type="date" value="${hojeNoMes}"></div>
      <div class="campo"><label>Mês da planilha</label><select id="nMes">${st.meses.map(m => `<option value="${m}" ${m === st.mes ? 'selected' : ''}>${nomeMes(m)}</option>`).join('')}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Pessoa</label><select id="nPessoa">${opts(st.cad['Pessoas'] || [], 'Gerais')}</select></div>
      <div class="campo"><label>Forma</label><select id="nForma">${opts(formas, 'PIX')}</select></div>
    </div>
    <div class="campo"><label>Categoria</label><select id="nCat">${opts(st.cad['Categorias'] || [], 'Outros')}</select></div>
    <div class="aviso">Compra no cartão de crédito não entra aqui: ela vem pela fatura do cartão.</div>
    <label class="check"><input type="checkbox" id="nPago" checked> Já está pago</label>
    <div class="campo"><label>Comprovante (opcional)</label><input type="file" id="nArq" accept="${ACEITA}"></div>
    <div class="campo"><label>Observação (opcional)</label><textarea id="nObs" rows="2"></textarea></div>
    <button class="btn pri" id="bSalvar">Salvar</button>
    <button class="btn" onclick="fecharFolha()">Cancelar</button>`);
  let tipo = 'Despesa';
  document.querySelectorAll('#tipo button').forEach(b => b.onclick = () => {
    tipo = b.dataset.v; document.querySelectorAll('#tipo button').forEach(x => x.classList.toggle('on', x === b));
    $('nPago').parentNode.lastChild.textContent = tipo === 'Receita' ? ' Já foi recebido' : ' Já está pago';
  });
  $('bSalvar').onclick = async e => {
    const valor = numero($('nValor').value);
    if (!$('nItem').value.trim()) return toast('Preencha o item');
    if (!isFinite(valor) || $('nValor').value.trim() === '') return toast('Valor inválido');
    e.target.disabled = true;
    try {
      let o = await call('criarLancamento', {
        tipo, item: $('nItem').value.trim(), valor, moeda: $('nMoeda').value, data: $('nData').value, mes: $('nMes').value,
        pessoa: $('nPessoa').value, forma_pgto: $('nForma').value, categoria: $('nCat').value, pago: $('nPago').checked, obs: $('nObs').value.trim(),
      });
      const f = $('nArq').files[0];
      if (f) { toast('Enviando comprovante…'); const a = await prepararArquivo(f); o = await call('anexarComprovante', o.id, a.nome, a.mime, a.b64); }
      fecharFolha();
      st.mes = o.mes; atualizarItem(o);
      toast('Lançado');
    } catch (err) { erro(err); e.target.disabled = false; }
  };
}

$('btnNovo').onclick = novo;
$('btnMais').onclick = mais;
document.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { st.aba = b.dataset.aba; render(); window.scrollTo(0, 0); });
$('ant').onclick = () => (st.aba === 'resumo' ? trocarAno(-1) : abrirMes(st.meses[st.meses.indexOf(st.mes) - 1]));
$('prox').onclick = () => (st.aba === 'resumo' ? trocarAno(1) : abrirMes(st.meses[st.meses.indexOf(st.mes) + 1]));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (SESSAO) carregarTudo(); else mostrarLogin();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisPronto()"></script>
</body>

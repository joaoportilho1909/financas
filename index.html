  $('bConc').onclick = async e => {
    const lista = [...document.querySelectorAll('[data-k]:checked')].map(c => pares[Number(c.dataset.k)]).map(p => ({ id: p.i.id, data: p.e.data }));
    if (!lista.length) return toast('Nada marcado');
    e.target.disabled = true; e.target.textContent = 'Gravando…';
    try {
      const novos = await call('conciliarExtrato', lista, arquivo);
      novos.forEach(n => { const k = st.itens.findIndex(i => i.id === n.id); if (k >= 0) st.itens[k] = n; });
      render(); fecharFolha(); toast(`${novos.length} ${novos.length === 1 ? 'lançamento marcado' : 'lançamentos marcados'} como pago`);
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Marcar como pago'; }
  };
}

// ---------- câmbio ----------

const fmtCambio = n => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
const mesCurto = mes => MESES[Number(mes.slice(5, 7)) - 1].slice(0, 3).toLowerCase() + '/' + mes.slice(0, 4);
const usdDe = mv => numero((String(mv.movimento).match(/US\$\s*([\d.,]+)/) || [])[1] || 'x');
// Lançamento em dólar segue a referência do mês quando o câmbio dele está vazio ou igual a ela; senão é câmbio real.
const segueRef = i => i.cambio === '' || i.cambio === null || Math.abs(Number(i.cambio) - Number(st.cambios[i.mes])) < 1e-6;

// Meses seguidos com a mesma referência viram uma faixa ("nov/2026 a jan/2028").
function faixasRef(meses) {
  const f = [];
  meses.forEach(mes => { const c = st.cambios[mes], u = f[f.length - 1]; if (u && u.c === c) u.fim = mes; else f.push({ ini: mes, fim: mes, c }); });
  return f;
}
const textoFaixas = meses => faixasRef(meses).map(f => `${mesCurto(f.ini)}${f.fim !== f.ini ? ' a ' + mesCurto(f.fim) : ''}: ${fmtCambio(f.c)}`).join('; ');

function telaCambio() {
  const feitos = (st.movs || []).filter(x => /^câmbio/i.test(x.movimento)).sort((a, b) => String(b.data).localeCompare(String(a.data)));
  abrirFolha(`
    <h3>Câmbio</h3>
    <div class="sub">Referência de ${esc(nomeMes(st.mes))}: ${fmtCambio(st.cambios[st.mes])}</div>
    <button class="btn pri" id="bNovoCambio">Registrar câmbio</button>
    <div class="bloco">Câmbios feitos (${feitos.length})</div>
    ${feitos.length ? `<details class="compras" open><summary>Ver</summary>${feitos.map(c => {
      const u = usdDe(c);
      return `<div><span class="d">${dataBR(c.data)}</span><span class="t">${esc(c.movimento)}<br><small>VET ${isFinite(u) && u > 0 ? fmtCambio(c.valor_brl / u) : '?'} · ${esc(nomeMes(c.mes))}</small></span><b>${brl(c.valor_brl)}</b></div>`;
    }).join('')}</details>` : '<div class="aviso">Nenhum câmbio registrado.</div>'}
    <div class="bloco">Referência por mês</div>
    <div class="dados">${faixasRef(st.meses).map(f => `<span>${mesCurto(f.ini)}${f.fim !== f.ini ? ' a ' + mesCurto(f.fim) : ''}</span><span>${fmtCambio(f.c)}</span>`).join('')}</div>
    <div class="campo"><label>Mudar a referência</label>
      <div class="linha2"><select id="refMes">${st.meses.map(x => `<option value="${x}" ${x === st.mes ? 'selected' : ''}>${esc(nomeMes(x))}</option>`).join('')}</select>
      <input id="refVal" inputmode="decimal" placeholder="${fmtCambio(st.cambios[st.mes])}"></div></div>
    <label class="check"><input type="checkbox" id="refSeg"> Aplicar também aos meses seguintes</label>
    <button class="btn" id="bRef">Salvar referência</button>
    <div class="aviso">Ao mudar a referência, são recalculados os lançamentos em dólar ainda não recebidos que seguem a referência antiga. Câmbio real e lançamento já recebido não mudam.</div>
    <button class="btn" id="bVoltar">Voltar</button>`);
  $('bVoltar').onclick = mais;
  $('bNovoCambio').onclick = novoCambio;
  $('bRef').onclick = e => {
    const v = numero($('refVal').value);
    if (!(v > 0)) return toast('Câmbio inválido');
    const mes = $('refMes').value;
    aplicarRef(e.target, $('refSeg').checked ? st.meses.filter(x => x >= mes) : [mes], v);
  };
}

async function aplicarRef(botao, meses, v) {
  botao.disabled = true;
  try {
    const r = await call('definirCambioRef', meses, v);
    Object.assign(st.cambios, r.cambios);
    r.itens.forEach(n => { const k = st.itens.findIndex(i => i.id === n.id); if (k >= 0) st.itens[k] = n; });
    render(); telaCambio();
    toast(`Referência salva${r.itens.length ? `, ${r.itens.length} ${r.itens.length === 1 ? 'lançamento recalculado' : 'lançamentos recalculados'}` : ''}`);
  } catch (err) { erro(err); botao.disabled = false; }
}

function novoCambio() {
  const abertos = st.itens.filter(i => i.moeda === 'USD' && !i.pago).sort((a, b) => a.mes.localeCompare(b.mes) || a.item.localeCompare(b.item));
  abrirFolha(`
    <h3>Registrar câmbio</h3>
    <div class="campo"><label>Data</label><input type="date" id="cData" value="${st.hoje}"></div>
    <div class="linha2">
      <div class="campo"><label>US$ enviados</label><input id="cUsd" inputmode="decimal"></div>
      <div class="campo"><label>R$ que caíram (líquido)</label><input id="cBrl" inputmode="decimal"></div>
    </div>
    <div class="aviso" id="cVet">VET: preencha US$ e R$</div>
    <div class="campo"><label>Aplicar a um lançamento em dólar (fica com este câmbio e marcado como recebido nesta data)</label>
      <select id="cLanc"><option value="">Nenhum</option>${abertos.map(i => `<option value="${esc(i.id)}">${esc(i.item)} · ${esc(nomeMes(i.mes))} · ${usd(i.valor)}</option>`).join('')}</select></div>
    <div class="campo"><label>Observação (cotação, custo, IOF)</label><input id="cObs"></div>
    <button class="btn pri" id="bCambio">Salvar câmbio</button>
    <button class="btn" id="bVoltar">Voltar</button>`);
  const vet = () => { const u = numero($('cUsd').value), r = numero($('cBrl').value); return u > 0 && r > 0 ? r / u : NaN; };
  ['cUsd', 'cBrl'].forEach(k => ($(k).oninput = () => { const v = vet(); $('cVet').textContent = isFinite(v) ? 'VET: ' + fmtCambio(v) : 'VET: preencha US$ e R$'; }));
  $('bVoltar').onclick = telaCambio;
  $('bCambio').onclick = async e => {
    if (!isFinite(vet())) return toast('Preencha US$ e R$');
    if (!/^\d{4}-\d{2}-\d{2}$/.test($('cData').value)) return toast('Data inválida');
    e.target.disabled = true; e.target.textContent = 'Gravando…';
    try {
      const r = await call('registrarCambio', { data: $('cData').value, usd: numero($('cUsd').value), brl: numero($('cBrl').value), lancId: $('cLanc').value, obs: $('cObs').value.trim() });
      (st.movs = st.movs || []).push(r.mov);
      if (r.item) { const k = st.itens.findIndex(i => i.id === r.item.id); if (k >= 0) st.itens[k] = r.item; }
      render();
      perguntarRef(r.vet, r.mov.mes);
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Salvar câmbio'; }
  };
}

// Depois de um câmbio real, pergunta se o VET vira a referência dos meses seguintes (decisão do João: perguntar a cada vez).
function perguntarRef(vet, mes) {
  const seguintes = st.meses.filter(x => x > mes);
  if (!seguintes.length) { telaCambio(); return toast('Câmbio registrado'); }
  const afetados = st.itens.filter(i => i.moeda === 'USD' && !i.pago && seguintes.includes(i.mes) && segueRef(i) && Number(i.cambio) !== vet);
  abrirFolha(`
    <h3>Câmbio registrado</h3>
    <div class="sub">VET ${fmtCambio(vet)}</div>
    <div class="campo">Usar ${fmtCambio(vet)} como referência de ${esc(nomeMes(seguintes[0]))} até ${esc(nomeMes(seguintes[seguintes.length - 1]))}?</div>
    <div class="aviso">Hoje: ${esc(textoFaixas(seguintes))}. Recalcula ${afetados.length} ${afetados.length === 1 ? 'lançamento em dólar ainda não recebido' : 'lançamentos em dólar ainda não recebidos'}.</div>
    <button class="btn pri" id="bSim">Sim, atualizar</button>
    <button class="btn" id="bNao">Não, manter</button>`);
  $('bNao').onclick = () => { telaCambio(); toast('Câmbio registrado'); };
  $('bSim').onclick = e => aplicarRef(e.target, seguintes, vet);
}

// ---------- recorrentes ----------

function somaMes(mes, n) {
  const [a, m] = mes.split('-').map(Number), t = a * 12 + m - 1 + n;
  return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`;
}
const fimRec = r => (r.parcelas === '' || r.parcelas === null ? '' : somaMes(String(r.inicio), Number(r.parcelas) - 1));
const recAtiva = r => r.ativo === true && (r.parcelas === '' || Number(r.parcelas) !== 0) && (!fimRec(r) || fimRec(r) >= st.hoje.slice(0, 7));
// Ordem que o João usa: receitas, aluguéis, cartões, o resto.
const grupoRec = r => (r.tipo === 'Receita' ? 0 : /aluguel/i.test(r.item) ? 1 : r.categoria === 'Cartões de Crédito' ? 2 : 3);
const valorRec = r => (r.moeda === 'USD' ? usd(r.valor_padrao) : brl(r.valor_padrao));
const prazoRec = r => (Number(r.parcelas) === 0 && r.parcelas !== '' ? 'encerrada' : !fimRec(r) ? 'contínua' : `${r.parcelas}x, ${mesCurto(String(r.inicio))} a ${mesCurto(fimRec(r))}`);
const trocarRec = r => { const k = st.recs.findIndex(x => x.id === r.id); if (k >= 0) st.recs[k] = r; else st.recs.push(r); };
const opcoesMes = sel => st.meses.map(m => `<option value="${m}" ${m === sel ? 'selected' : ''}>${esc(nomeMes(m))}</option>`).join('');
const mesAtual = () => st.meses.find(m => m >= st.hoje.slice(0, 7)) || st.mes;

function telaRecorrentes() {
  const recs = (st.recs || []).slice().sort((a, b) => grupoRec(a) - grupoRec(b) || a.id.localeCompare(b.id));
  const ativas = recs.filter(recAtiva), outras = recs.filter(r => !recAtiva(r));
  const linhaR = r => `<div class="item" data-rec="${esc(r.id)}">${icone(r)}<div class="txt"><div class="nome">${esc(r.item)}</div>
    <div class="sub">${esc([r.pessoa, 'dia ' + r.dia_venc, prazoRec(r)].join(' · '))}</div></div><div class="val ${r.tipo === 'Receita' ? 'verde' : ''}">${valorRec(r)}</div></div>`;
  let h = `<h3>Recorrentes</h3><div class="sub">${ativas.length} ativas</div><button class="btn pri" id="bNovaRec">Nova recorrente</button>`;
  ['Receitas', 'Aluguéis', 'Cartões', 'Demais despesas'].forEach((n, g) => {
    const l = ativas.filter(r => grupoRec(r) === g);
    if (l.length) h += `<div class="bloco">${n} (${l.length})</div><div class="lista">${l.map(linhaR).join('')}</div>`;
  });
  if (outras.length) h += `<details class="grupo"><summary>Encerradas (${outras.length})</summary><div class="lista">${outras.map(linhaR).join('')}</div></details>`;
  abrirFolha(h + '<button class="btn" id="bVoltar">Voltar</button>');
  $('bVoltar').onclick = mais;
  $('bNovaRec').onclick = novaRec;
  document.querySelectorAll('[data-rec]').forEach(el => (el.onclick = () => detalheRec(el.dataset.rec)));
}

function detalheRec(id) {
  const r = st.recs.find(x => x.id === id);
  const linhas = st.itens.filter(i => i.origem === id);
  const abertas = linhas.filter(i => !i.pago);
  const temOv = i => i.valor_mes !== '' && i.valor_mes !== null;
  abrirFolha(`
    <h3>${esc(r.item)}</h3>
    <div class="sub">${esc(r.tipo)} · ${esc(r.pessoa)} · ${esc(r.categoria)}</div>
    <div class="dados">
      <span>Valor padrão</span><span><b>${valorRec(r)}</b></span>
      <span>Vencimento</span><span>dia ${esc(r.dia_venc)}</span>
      <span>Forma</span><span>${esc(r.forma_pgto)}</span>
      <span>Prazo</span><span>${esc(prazoRec(r))}${r.ativo === true ? '' : ' (desativada)'}</span>
      <span>Meses no app</span><span>${linhas.length}, ${abertas.length} em aberto</span>
    </div>
    ${r.obs ? `<div class="aviso">${esc(r.obs)}</div>` : ''}
    <div class="bloco">Mudar valor ou dia</div>
    <div class="campo"><label>A partir de</label><select id="rDesde">${opcoesMes(mesAtual())}</select></div>
    <div class="linha2">
      <div class="campo"><label>Valor novo ${r.moeda === 'USD' ? '(US$)' : '(R$)'}</label><input id="rValor" inputmode="decimal" placeholder="${String(r.valor_padrao).replace('.', ',')}"></div>
      <div class="campo"><label>Dia novo</label><input id="rDia" inputmode="numeric" placeholder="${esc(r.dia_venc)}"></div>
    </div>
    <div class="aviso" id="rEfeito"></div>
    <button class="btn pri" id="bRecMudar">Aplicar mudança</button>
    <div class="bloco">Encerrar</div>
    <div class="campo"><label>Sai dos meses a partir de</label><select id="rFim">${opcoesMes(mesAtual())}</select></div>
    <div class="aviso" id="rEfeitoFim"></div>
    <button class="btn perigo" id="bRecFim">Encerrar</button>
    <button class="btn" id="bVoltar">Voltar</button>`);
  const efeito = () => {
    const d = $('rDesde').value, l = abertas.filter(i => i.mes >= d), ov = l.filter(temOv).length;
    $('rEfeito').textContent = `Muda ${l.length} ${l.length === 1 ? 'mês em aberto' : 'meses em aberto'} de ${nomeMes(d)} em diante.`
      + (ov ? ` Em ${ov} com valor do mês próprio, só o valor previsto muda.` : '') + ' Meses pagos ou recebidos não mudam.';
  };
  const efeitoFim = () => {
    const d = $('rFim').value, l = linhas.filter(i => i.mes >= d), fica = l.filter(i => i.pago || i.comprovante).length;
    $('rEfeitoFim').textContent = `Apaga ${l.length - fica} ${l.length - fica === 1 ? 'mês' : 'meses'} em aberto de ${nomeMes(d)} em diante`
      + (fica ? `; ${fica} pago(s) ou com comprovante ficam.` : '.');
  };
  $('rDesde').onchange = efeito; $('rFim').onchange = efeitoFim; efeito(); efeitoFim();
  $('bVoltar').onclick = telaRecorrentes;
  $('bRecMudar').onclick = async e => {
    const v = $('rValor').value.trim(), dd = $('rDia').value.trim();
    if (!v && !dd) return toast('Preencha o valor ou o dia');
    if (v && !isFinite(numero(v))) return toast('Valor inválido');
    if (dd && !(Number(dd) >= 1 && Number(dd) <= 31)) return toast('Dia inválido');
    e.target.disabled = true; e.target.textContent = 'Gravando…';
    try {
      const res = await call('alterarRecorrente', id, { aPartirDe: $('rDesde').value, valor: v ? numero(v) : '', dia_venc: dd ? Number(dd) : '' });
      trocarRec(res.rec);
      res.itens.forEach(n => { const k = st.itens.findIndex(i => i.id === n.id); if (k >= 0) st.itens[k] = n; });
      render(); detalheRec(id);
      toast(`${res.itens.length} ${res.itens.length === 1 ? 'mês atualizado' : 'meses atualizados'}`);
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Aplicar mudança'; }
  };
  $('bRecFim').onclick = async e => {
    if (e.target.dataset.conf !== '1') { e.target.dataset.conf = '1'; e.target.textContent = 'Toque de novo para encerrar'; return; }
    e.target.disabled = true; e.target.textContent = 'Encerrando…';
    try {
      const res = await call('encerrarRecorrente', id, $('rFim').value);
      trocarRec(res.rec);
      st.itens = st.itens.filter(i => !res.removidos.includes(i.id));
      render(); detalheRec(id);
      toast(`Encerrada: ${res.removidos.length} ${res.removidos.length === 1 ? 'mês removido' : 'meses removidos'}${res.mantidos.length ? `, ${res.mantidos.length} mantido(s)` : ''}`);
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Encerrar'; }
  };
}

function novaRec() {
  const opts = (lista, sel) => lista.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
  abrirFolha(`
    <h3>Nova recorrente</h3>
    <div class="seg" id="rTipo"><button class="on" data-v="Despesa">Despesa</button><button data-v="Receita">Receita</button></div>
    <div class="campo"><label>Item</label><input id="nrItem" placeholder="Ex.: Academia, escola, seguro"></div>
    <div class="linha2">
      <div class="campo"><label>Valor</label><input id="nrValor" inputmode="decimal" placeholder="0,00"></div>
      <div class="campo"><label>Moeda</label><select id="nrMoeda">${opts(st.cad['Moeda'] || ['BRL'], 'BRL')}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Dia do vencimento</label><input id="nrDia" inputmode="numeric" placeholder="10"></div>
      <div class="campo"><label>Começa em</label><select id="nrIni">${opcoesMes(mesAtual())}</select></div>
    </div>
    <div class="campo"><label>Número de parcelas (vazio = contínua até o fim do app)</label><input id="nrParc" inputmode="numeric"></div>
    <div class="linha2">
      <div class="campo"><label>Pessoa</label><select id="nrPessoa">${opts(st.cad['Pessoas'] || [], 'Gerais')}</select></div>
      <div class="campo"><label>Forma</label><select id="nrForma">${opts(st.cad['Forma Pgto'] || [], 'PIX')}</select></div>
    </div>
    <div class="campo"><label>Categoria</label><select id="nrCat">${opts(st.cad['Categorias'] || [], 'Outros')}</select></div>
    <div class="campo"><label>Observação (opcional)</label><textarea id="nrObs" rows="2"></textarea></div>
    <div class="aviso" id="nrEfeito"></div>
    <button class="btn pri" id="bNrSalvar">Criar</button>
    <button class="btn" id="bVoltar">Voltar</button>`);
  let tipo = 'Despesa';
  document.querySelectorAll('#rTipo button').forEach(b => (b.onclick = () => { tipo = b.dataset.v; document.querySelectorAll('#rTipo button').forEach(x => x.classList.toggle('on', x === b)); }));
  const qtd = () => {
    const ini = $('nrIni').value, p = $('nrParc').value.trim(), resto = st.meses.filter(m => m >= ini);
    return p === '' ? resto : resto.slice(0, Number(p));
  };
  const efeito = () => {
    const l = qtd(), p = $('nrParc').value.trim();
    if (p !== '' && !(Number(p) >= 1)) return ($('nrEfeito').textContent = 'Parcelas inválidas');
    $('nrEfeito').textContent = l.length ? `Cria ${l.length} ${l.length === 1 ? 'mês' : 'meses'}, de ${nomeMes(l[0])} a ${nomeMes(l[l.length - 1])}.`
      + (p !== '' && Number(p) > l.length ? ` As outras ${Number(p) - l.length} parcelas passam do último mês do app.` : '') : 'Nenhum mês para criar.';
  };
  $('nrIni').onchange = efeito; $('nrParc').oninput = efeito; efeito();
  $('bVoltar').onclick = telaRecorrentes;
  $('bNrSalvar').onclick = async e => {
    const valor = numero($('nrValor').value), dia = Number($('nrDia').value), p = $('nrParc').value.trim();
    if (!$('nrItem').value.trim()) return toast('Preencha o item');
    if (!isFinite(valor) || $('nrValor').value.trim() === '') return toast('Valor inválido');
    if (!(dia >= 1 && dia <= 31)) return toast('Dia inválido');
    if (p !== '' && !(Number(p) >= 1)) return toast('Parcelas inválidas');
    e.target.disabled = true; e.target.textContent = 'Criando…';
    try {
      const res = await call('criarRecorrente', {
        tipo, item: $('nrItem').value.trim(), valor, moeda: $('nrMoeda').value, dia_venc: dia, inicio: $('nrIni').value,
        parcelas: p === '' ? '' : Number(p), pessoa: $('nrPessoa').value, forma_pgto: $('nrForma').value, categoria: $('nrCat').value, obs: $('nrObs').value.trim(),
      });
      trocarRec(res.rec);
      st.itens = st.itens.concat(res.itens);
      render(); detalheRec(res.rec.id);
      toast(`Criada em ${res.itens.length} ${res.itens.length === 1 ? 'mês' : 'meses'}`);
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Criar'; }
  };
}

// ---------- resumo do ano ----------

const anosDoApp = () => [...new Set(st.meses.map(m => m.slice(0, 4)))];
const anoResumo = () => (st.anoResumo && anosDoApp().includes(st.anoResumo) ? st.anoResumo : st.mes.slice(0, 4));
function trocarAno(d) { const a = anosDoApp(), k = a.indexOf(anoResumo()) + d; if (a[k]) { st.anoResumo = a[k]; render(); } }
const milhar = n => (st.oculto ? '••••' : Math.round(n).toLocaleString('pt-BR'));
const curto = n => (Math.abs(n) >= 1000 ? (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil' : Math.round(n).toLocaleString('pt-BR'));
// Cores das séries, em ordem fixa (validadas: daltonismo e visão normal). Verde e vermelho ficam para receita e despesa.
const COR_REC = '#2f8a5b', COR_DESP = '#c2402f', COR_FIXA = '#2450b8', COR_AVULSA = '#e0892f';
const CORES_PESSOA = ['#2a9d8f', '#e0892f', '#8e6bbf', '#c9a227'];
const SECOES = ['Geral', 'Pessoas', 'Categorias', 'Cartão', 'Parcelas', 'Dólar'];
const doFiltro = i => st.pessoa === 'Todos' || i.pessoa === st.pessoa;
const mesesDoAno = ano => st.meses.filter(m => m.startsWith(ano));
const rotMeses = ms => ms.map(m => ({ txt: MESES[Number(m.slice(5)) - 1][0], atual: m === st.hoje.slice(0, 7) }));
const legenda = l => `<div class="leg">${l.map(([n, c]) => `<span style="--c:${c}">${esc(n)}</span>`).join('')}</div>`;
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0) + '%';
const somaBRL = l => l.reduce((t, i) => t + (Number(i.valor_brl) || 0), 0);
const previstoBRL = i => (i.valor_previsto === '' || i.valor_previsto === null ? Number(i.valor_brl) || 0 : i.moeda === 'USD' ? Number(i.valor_previsto) * (Number(i.cambio) || Number(st.cambios[i.mes]) || 0) : Number(i.valor_previsto) || 0);
const dicaMes = s => `<b>${esc(nomeMes(s.mes))}</b><br>Receitas ${m(s.rec)}<br>Despesas ${m(s.desp)}<br>Saldo ${m(s.saldo)}`;

// Receitas e despesas de cada mês do ano (respeita o filtro de pessoa); acumulado começa em janeiro.
function serieAno(ano) {
  let acum = 0;
  return mesesDoAno(ano).map(mes => {
    const t = totais(st.itens.filter(i => i.mes === mes && doFiltro(i)));
    acum += t.rec - t.desp;
    return { mes, rec: t.rec, desp: t.desp, saldo: t.rec - t.desp, acum };
  });
}

// Topo da barra arredondado e base reta no eixo.
function barra(x, y0, w, v, esc) {
  const h = Math.abs(v) * esc; if (h < 0.5) return '';
  const r = Math.min(3, w / 2, h), y = v >= 0 ? y0 - h : y0 + h, s = v >= 0 ? 1 : -1;
  return `M${x},${y0}V${y + s * r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + s * r}V${y0}Z`;
}
const grade = (esq, W, base, e, max) => [0, max / 2, max].map(v => `<line x1="${esq}" x2="${W}" y1="${base - v * e}" y2="${base - v * e}" stroke="var(--line)" stroke-width="1"/>`
  + (v ? `<text class="eixo" x="${esq - 4}" y="${base - v * e + 3}" text-anchor="end">${st.oculto ? '' : curto(v)}</text>` : '')).join('');
const alvos = (esq, larg, n, H) => Array.from({ length: n }, (_, k) => `<rect class="alvo" data-k="${k}" x="${esq + k * larg}" y="0" width="${larg}" height="${H}" rx="6"/>`).join('');
const rotX = (r, x, y) => `<text class="eixo ${r.atual ? 'atual' : ''}" x="${x}" y="${y}" text-anchor="middle">${r.txt}</text>`;
const grafico = (id, W, H, rotulo, corpo) => `<div class="graf" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(rotulo)}">${corpo}</svg><div class="dica"></div></div>`;

// Barras lado a lado: receitas à esquerda, despesas à direita.
function graficoMeses(serie) {
  const W = 340, H = 150, base = 128, topo = 8, esq = 30, larg = (W - esq) / serie.length;
  const max = Math.max(1, ...serie.flatMap(s => [s.rec, s.desp])), e = (base - topo) / max, rot = rotMeses(serie.map(s => s.mes));
  st.dicas.gMeses = serie.map(dicaMes);
  const barras = serie.map((s, k) => {
    const x = esq + k * larg + larg / 2, w = Math.min(9, larg / 2 - 3);
    return `<path d="${barra(x - w - 1, base, w, s.rec, e)}" fill="${COR_REC}"/><path d="${barra(x + 1, base, w, s.desp, e)}" fill="${COR_DESP}"/>` + rotX(rot[k], x, H - 6);
  }).join('');
  return grafico('gMeses', W, H, 'Receitas e despesas por mês', alvos(esq, larg, serie.length, H) + grade(esq, W, base, e, max) + barras);
}

// Barras empilhadas por mês (2px de superfície entre os pedaços, topo arredondado). series = [{ nome, cor, vals }].
function grafPilha(id, rot, series, dicas, rotulo) {
  const W = 340, H = 150, base = 128, topo = 8, esq = 30, n = rot.length, larg = (W - esq) / n;
  const tot = rot.map((_, k) => series.reduce((t, s) => t + Math.max(0, s.vals[k]), 0));
  const max = Math.max(1, ...tot), e = (base - topo) / max;
  st.dicas[id] = dicas;
  let g = grade(esq, W, base, e, max);
  rot.forEach((r, k) => {
    const w = Math.min(16, larg - 6), x = esq + k * larg + (larg - w) / 2;
    const vis = series.map(s => [s.cor, Math.max(0, s.vals[k])]).filter(v => v[1] * e >= 0.5);
    let y = base;
    vis.forEach(([cor, v], q) => {
      const hh = v * e, ult = q === vis.length - 1, alt = ult ? hh : Math.max(0.5, hh - 2);
      g += ult ? `<path d="${barra(x, y, w, alt, 1)}" fill="${cor}"/>` : `<rect x="${x}" y="${y - alt}" width="${w}" height="${alt}" fill="${cor}"/>`;
      y -= hh;
    });
    g += rotX(r, esq + k * larg + larg / 2, H - 6);
  });
  return grafico(id, W, H, rotulo, alvos(esq, larg, n, H) + g);
}

// Barras para cima e para baixo de uma linha zero (positivo numa cor, negativo na outra).
function grafDiverg(id, rot, vals, corPos, corNeg, dicas, rotulo) {
  const W = 340, H = 120, esq = 30, n = rot.length, larg = (W - esq) / n;
  const max = Math.max(1, ...vals.map(Math.abs)), neg = vals.some(v => v < 0), pos = vals.some(v => v > 0);
  const zero = neg && pos ? 52 : neg ? 8 : 96, e = (neg && pos ? 44 : 86) / max;
  st.dicas[id] = dicas;
  const barras = vals.map((v, k) => {
    const x = esq + k * larg + larg / 2, w = Math.min(14, larg - 8);
    return `<path d="${barra(x - w / 2, zero, w, v, e)}" fill="${v >= 0 ? corPos : corNeg}"/>` + rotX(rot[k], x, H - 4);
  }).join('');
  const marca = v => `<text class="eixo" x="${esq - 4}" y="${zero - v * e + 3}" text-anchor="end">${st.oculto ? '' : curto(v)}</text>`;
  return grafico(id, W, H, rotulo, alvos(esq, larg, n, H) + `<line x1="${esq}" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--muted)" stroke-width="1"/>`
    + (pos ? marca(max) : '') + (neg ? marca(-max) : '') + barras);
}

// Linha com marcadores; vals com null onde não há dado. cheio[k] = marcador cheio (câmbio real) ou vazado (referência).
function grafLinha(id, rot, vals, cheio, dicas, rotulo, fmt) {
  const W = 340, H = 130, esq = 40, base = 106, topo = 12, n = rot.length, larg = (W - esq) / n;
  const v = vals.filter(x => x !== null), mn = Math.min(...v), mx = Math.max(...v), folga = (mx - mn) * 0.2 || 0.05;
  const lo = mn - folga, hi = mx + folga, e = (base - topo) / (hi - lo), y = x => base - (x - lo) * e;
  st.dicas[id] = dicas;
  const pts = vals.map((x, k) => (x === null ? null : [esq + k * larg + larg / 2, y(x)]));
  let traco = '', abre = true;
  pts.forEach(p => { if (!p) { abre = true; return; } traco += `${abre ? 'M' : 'L'}${p[0]},${p[1]}`; abre = false; });
  const eixos = [lo + folga, hi - folga].map(t => `<line x1="${esq}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text class="eixo" x="${esq - 4}" y="${y(t) + 3}" text-anchor="end">${fmt(t)}</text>`).join('');
  const marcas = pts.map((p, k) => (p ? `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${cheio[k] ? COR_FIXA : 'var(--card)'}" stroke="${COR_FIXA}" stroke-width="2"/>` : '')).join('');
  return grafico(id, W, H, rotulo, alvos(esq, larg, n, H) + eixos + `<path d="${traco}" fill="none" stroke="${COR_FIXA}" stroke-width="2"/>` + marcas
    + rot.map((r, k) => rotX(r, esq + k * larg + larg / 2, H - 6)).join(''));
}

// Mapa de calor: uma linha por categoria, uma coluna por mês; azul mais escuro onde gastou mais (uma cor só, claro para escuro).
const corCalor = t => {
  if (t <= 0) return '#eef1f6';
  const a = [226, 233, 251], b = [30, 63, 145], k = 0.12 + 0.88 * t;
  return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * k)).join(',')})`;
};
function grafCalor(id, cats, meses, val, rotulo) {
  const W = 340, esq = 98, cw = (W - esq) / meses.length, ch = 20, H = cats.length * ch + 18;
  const max = Math.max(1, ...cats.flatMap(c => meses.map(ms => val(c, ms))));
  const dicas = [];
  let g = '';
  cats.forEach((c, r) => {
    const nome = c.length > 17 ? c.slice(0, 16) + '…' : c;
    g += `<text class="eixo" x="${esq - 6}" y="${r * ch + ch / 2 + 3}" text-anchor="end">${esc(nome)}</text>`;
    meses.forEach((ms, k) => {
      const v = val(c, ms);
      g += `<rect class="cel" data-k="${dicas.length}" x="${esq + k * cw + 1}" y="${r * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="3" fill="${corCalor(v / max)}"/>`;
      dicas.push(`<b>${esc(c)}</b><br>${esc(nomeMes(ms))}: ${m(v)}`);
    });
  });
  rotMeses(meses).forEach((r, k) => (g += rotX(r, esq + k * cw + cw / 2, H - 4)));
  st.dicas[id] = dicas;
  return grafico(id, W, H, rotulo, g);
}

// Lista com barra de proporção, sem ícone (estabelecimentos, diferenças).
const listaBarras = l => {
  const max = Math.max(1, ...l.map(x => Math.abs(x.v)));
  return `<div class="grade">${l.map(x => `<div class="g sem-ico"><span class="nome">${esc(x.nome)}${x.sub ? `<br><small>${esc(x.sub)}</small>` : ''}</span><b class="${x.cls || ''}">${x.txt || m(x.v)}</b>
    <span class="barra-cat"><i style="width:${(100 * Math.abs(x.v) / max).toFixed(1)}%;${x.cor ? 'background:' + x.cor : ''}"></i></span></div>`).join('')}</div>`;
};

function telaResumo() {
  const sec = SECOES.includes(st.secResumo) ? st.secResumo : 'Geral', ano = anoResumo();
  st.dicas = {};
  const corpo = { Geral: resGeral, Pessoas: resPessoas, Categorias: resCategorias, 'Cartão': resCartao, Parcelas: resParcelas, 'Dólar': resDolar }[sec](ano);
  return `<div class="chips secoes">${SECOES.map(s => `<button class="chip ${s === sec ? 'on' : ''}" data-sec="${s}">${s}</button>`).join('')}</div>` + corpo;
}

function resGeral(ano) {
  const serie = serieAno(ano), meses = serie.map(s => s.mes), rot = rotMeses(meses), atual = st.hoje.slice(0, 7);
  const rec = serie.reduce((t, s) => t + s.rec, 0), desp = serie.reduce((t, s) => t + s.desp, 0);
  const desps = st.itens.filter(i => i.tipo === 'Despesa' && i.mes.startsWith(ano) && doFiltro(i));
  const fixa = meses.map(ms => somaBRL(desps.filter(i => i.mes === ms && i.origem !== 'extra')));
  const avulsa = meses.map(ms => somaBRL(desps.filter(i => i.mes === ms && i.origem === 'extra')));
  const tf = fixa.reduce((a, b) => a + b, 0), ta = avulsa.reduce((a, b) => a + b, 0);
  const passados = meses.filter(ms => ms <= atual);
  const dif = passados.map(ms => desps.filter(i => i.mes === ms).reduce((t, i) => t + (Number(i.valor_brl) || 0) - previstoBRL(i), 0));
  const porItem = {};
  desps.filter(i => i.mes <= atual).forEach(i => {
    const k = i.item, d = porItem[k] || (porItem[k] = { prev: 0, real: 0 });
    d.prev += previstoBRL(i); d.real += Number(i.valor_brl) || 0;
  });
  const difs = Object.entries(porItem).map(([nome, d]) => ({ nome, v: d.real - d.prev, d })).filter(x => Math.abs(x.v) >= 1)
    .sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 6);
  const tPrev = desps.filter(i => i.mes <= atual).reduce((t, i) => t + previstoBRL(i), 0), tReal = somaBRL(desps.filter(i => i.mes <= atual));
  let h = `
    <div class="card"><div class="tiles">
      <div><small>Receitas</small><b class="verde">${m(rec)}</b></div>
      <div><small>Despesas</small><b class="vermelho">${m(desp)}</b></div>
      <div><small>Saldo do ano</small><b class="${rec - desp < 0 ? 'vermelho' : ''}">${m(rec - desp)}</b></div>
    </div></div>
    <div class="card"><h2>Receitas e despesas</h2>${legenda([['Receitas', COR_REC], ['Despesas', COR_DESP]])}${graficoMeses(serie)}</div>
    <div class="card"><h2>Saldo de cada mês</h2>${grafDiverg('gSaldo', rot, serie.map(s => s.saldo), COR_REC, COR_DESP, serie.map(dicaMes), 'Saldo de cada mês')}</div>
    <div class="card"><h2>Mês a mês</h2>
      <table class="anual"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Saldo</th><th>Acum.</th></tr></thead><tbody>
      ${serie.map(s => `<tr data-mes="${s.mes}" class="${s.mes === atual ? 'atual' : ''}"><td>${MESES[Number(s.mes.slice(5)) - 1].slice(0, 3)}</td><td>${milhar(s.rec)}</td><td>${milhar(s.desp)}</td>
        <td class="${s.saldo < 0 ? 'vermelho' : ''}">${milhar(s.saldo)}</td><td class="${s.acum < 0 ? 'vermelho' : ''}">${milhar(s.acum)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Ano</td><td>${milhar(rec)}</td><td>${milhar(desp)}</td><td class="${rec - desp < 0 ? 'vermelho' : ''}">${milhar(rec - desp)}</td><td></td></tr></tfoot></table>
      <div class="aviso">Valores em reais, sem centavos. Toque num mês para abrir. O acumulado soma os saldos a partir de janeiro; não é o saldo das contas.</div></div>
    <div class="card"><h2>Despesas fixas e avulsas</h2>
      <div class="aviso" style="margin:-6px 0 4px">Fixas (recorrentes) ${m(tf)} (${pct(tf, tf + ta)}). Avulsas ${m(ta)} (${pct(ta, tf + ta)}).</div>
      ${legenda([['Fixas', COR_FIXA], ['Avulsas', COR_AVULSA]])}
      ${grafPilha('gFixas', rot, [{ cor: COR_FIXA, vals: fixa }, { cor: COR_AVULSA, vals: avulsa }],
        meses.map((ms, k) => `<b>${esc(nomeMes(ms))}</b><br>Fixas ${m(fixa[k])}<br>Avulsas ${m(avulsa[k])}`), 'Despesas fixas e avulsas por mês')}</div>`;
  h += `<div class="card"><h2>Previsto e valor do mês</h2>`;
  if (!passados.length) h += '<div class="aviso">Ainda não há meses deste ano até hoje.</div>';
  else h += `<div class="aviso" style="margin:-6px 0 4px">Despesas até ${esc(nomeMes(passados[passados.length - 1]))}: previsto ${m(tPrev)}, valor do mês ${m(tReal)}, diferença ${m(tReal - tPrev)}.</div>
      ${legenda([['Acima do previsto', COR_DESP], ['Abaixo do previsto', COR_REC]])}
      ${grafDiverg('gPrev', rotMeses(passados), dif, COR_DESP, COR_REC, passados.map((ms, k) => `<b>${esc(nomeMes(ms))}</b><br>${dif[k] >= 0 ? 'Acima' : 'Abaixo'} do previsto: ${m(Math.abs(dif[k]))}`), 'Diferença entre valor do mês e previsto')}
      ${difs.length ? `<div class="bloco">Maiores diferenças no ano</div>${listaBarras(difs.map(x => ({ nome: x.nome, sub: `previsto ${m(x.d.prev)}, valor do mês ${m(x.d.real)}`, v: x.v, txt: (x.v > 0 ? '+' : '−') + m(Math.abs(x.v)), cls: x.v > 0 ? 'vermelho' : 'verde', cor: x.v > 0 ? COR_DESP : COR_REC })))}` : ''}
      <div class="aviso">Previsto é o valor padrão da recorrente; valor do mês é o que está gravado (fatura importada, valor corrigido). Meses futuros ficam de fora.</div>`;
  return h + '</div>';
}

function resPessoas(ano) {
  const pessoas = (st.cad['Pessoas'] || []).filter(p => st.pessoa === 'Todos' || p === st.pessoa);
  const meses = mesesDoAno(ano), doAno = st.itens.filter(i => i.mes.startsWith(ano));
  const cor = p => CORES_PESSOA[(st.cad['Pessoas'] || []).indexOf(p) % CORES_PESSOA.length];
  const linhas = pessoas.map(p => {
    const l = doAno.filter(i => i.pessoa === p);
    return { p, rec: somaBRL(l.filter(i => i.tipo === 'Receita')), desp: somaBRL(l.filter(i => i.tipo === 'Despesa')) };
  });
  const series = pessoas.map(p => ({ cor: cor(p), vals: meses.map(ms => somaBRL(doAno.filter(i => i.mes === ms && i.pessoa === p && i.tipo === 'Despesa'))) }));
  const dicas = meses.map((ms, k) => `<b>${esc(nomeMes(ms))}</b>` + pessoas.map((p, j) => `<br>${esc(p)} ${m(series[j].vals[k])}`).join(''));
  const totDesp = linhas.reduce((t, x) => t + x.desp, 0);
  let h = `<div class="card"><h2>Por pessoa no ano</h2>
    <table class="anual"><thead><tr><th>Pessoa</th><th>Receitas</th><th>Despesas</th><th>Saldo</th><th>Desp. %</th></tr></thead><tbody>
    ${linhas.map(x => `<tr><td><span class="ponto" style="background:${cor(x.p)}"></span> ${esc(x.p)}</td><td>${milhar(x.rec)}</td><td>${milhar(x.desp)}</td>
      <td class="${x.rec - x.desp < 0 ? 'vermelho' : ''}">${milhar(x.rec - x.desp)}</td><td>${pct(x.desp, totDesp)}</td></tr>`).join('')}
    </tbody></table>
    <div class="aviso">Gerais são as contas da casa; GP é a empresa. Valores em reais, sem centavos.</div></div>
    <div class="card"><h2>Despesas por pessoa, mês a mês</h2>${legenda(pessoas.map(p => [p, cor(p)]))}
    ${grafPilha('gPessoas', rotMeses(meses), series, dicas, 'Despesas por pessoa por mês')}</div>`;
  pessoas.forEach(p => {
    const porCat = {};
    doAno.filter(i => i.pessoa === p && i.tipo === 'Despesa').forEach(i => { const c = i.categoria || 'Outros'; porCat[c] = (porCat[c] || 0) + (Number(i.valor_brl) || 0); });
    const cats = Object.entries(porCat).filter(c => c[1] > 0.005).sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (cats.length) h += `<div class="card"><h2><span><span class="ponto" style="background:${cor(p)}"></span> ${esc(p)}: maiores categorias</span></h2>${htmlGrade(cats)}</div>`;
  });
  return h;
}

function resCategorias(ano) {
  const meses = mesesDoAno(ano), desps = st.itens.filter(i => i.tipo === 'Despesa' && i.mes.startsWith(ano) && doFiltro(i));
  const porCat = {};
  desps.forEach(i => { const c = i.categoria || 'Outros'; porCat[c] = (porCat[c] || 0) + (Number(i.valor_brl) || 0); });
  const cats = Object.entries(porCat).filter(c => c[1] > 0.005).sort((a, b) => b[1] - a[1]);
  if (!cats.length) return '<p class="vazio">Sem despesas neste ano.</p>';
  const val = (c, ms) => somaBRL(desps.filter(i => i.mes === ms && (i.categoria || 'Outros') === c));
  return `<div class="card"><h2>Categoria e mês</h2><div class="aviso" style="margin:-6px 0 6px">Quanto mais escuro, mais gasto. Toque num quadrado para ver o valor.</div>
      ${grafCalor('gCalor', cats.map(c => c[0]), meses, val, 'Despesas por categoria e mês')}</div>
    <div class="card"><h2>Despesas do ano por categoria</h2>${htmlGrade(cats)}</div>`;
}

// Estabelecimento: nome conhecido quando bate; senão a descrição sem prefixo de maquininha ("DL *", "IFD*").
const MARCAS = [[/uber/i, 'Uber'], [/ifood|ifd\*/i, 'iFood'], [/amazon/i, 'Amazon'], [/booking/i, 'Booking'], [/smiles/i, 'Smiles'], [/apple\.com/i, 'Apple'],
  [/google|youtube/i, 'Google/YouTube'], [/netflix/i, 'Netflix'], [/spotify/i, 'Spotify'], [/shopee/i, 'Shopee'], [/mercado ?livre|mlp\*/i, 'Mercado Livre'],
  [/latam/i, 'Latam'], [/gol linhas/i, 'Gol'], [/azul linhas/i, 'Azul'], [/drogasil|droga ?raia|drogaria/i, 'Farmácia'], [/playstation/i, 'PlayStation'],
  [/samsung/i, 'Samsung'], [/netshoes/i, 'Netshoes'], [/botafogo|sociotorcedor/i, 'Botafogo']];
const marcaDe = d => { const k = MARCAS.find(x => x[0].test(d)); return k ? k[1] : d.replace(/^[a-z]{1,4}\s*\*\s*/i, '').trim().split(/\s+/).slice(0, 3).join(' '); };

function resCartao(ano) {
  const lancs = new Map(st.itens.filter(i => i.mes.startsWith(ano) && doFiltro(i)).map(i => [i.id, i]));
  const compras = (st.compras || []).filter(c => lancs.has(c.lanc_id));
  if (!compras.length) return '<div class="card"><p class="vazio">Nenhuma fatura importada neste ano para esse filtro.</p></div>';
  const g = {};
  compras.filter(c => c.tipo === 'compra' || c.tipo === 'estorno').forEach(c => {
    const k = marcaDe(c.descricao), x = g[k] || (g[k] = { v: 0, n: 0 }); x.v += Number(c.valor); x.n += c.tipo === 'compra' ? 1 : 0;
  });
  const top = Object.entries(g).map(([nome, x]) => ({ nome, v: x.v, sub: `${x.n} ${x.n === 1 ? 'compra' : 'compras'}` })).filter(x => x.v > 0.005).sort((a, b) => b.v - a.v).slice(0, 10);
  const faturas = [...new Set(compras.map(c => c.lanc_id))].map(id => lancs.get(id)).sort((a, b) => a.mes.localeCompare(b.mes) || a.item.localeCompare(b.item));
  return `<div class="card"><h2>Onde mais gastou</h2><div class="aviso" style="margin:-6px 0 4px">Compras das faturas importadas no ano, somadas por estabelecimento.</div>${listaBarras(top.map(x => Object.assign(x, { cor: COR_FIXA })))}</div>
    <div class="card"><h2>Compras por categoria</h2>${htmlGrade(gradeCategorias(compras))}</div>
    <div class="card"><h2>Faturas importadas (${faturas.length})</h2><div class="lista">${faturas.map(linha).join('')}</div></div>`;
}

// Parcelas daqui para frente: o que tem número de parcela, em aberto, do mês atual em diante (não depende do ano escolhido).
function resParcelas() {
  const atual = mesAtual();
  const abertas = st.itens.filter(i => i.tipo === 'Despesa' && /^\d+\/\d+$/.test(String(i.parcela)) && !i.pago && i.mes >= atual && doFiltro(i));
  if (!abertas.length) return '<div class="card"><p class="vazio">Nenhuma parcela em aberto daqui para frente.</p></div>';
  const meses = st.meses.filter(ms => ms >= atual && ms <= abertas.reduce((a, i) => (i.mes > a ? i.mes : a), atual));
  const porMes = meses.map(ms => somaBRL(abertas.filter(i => i.mes === ms)));
  const grupos = {};
  abertas.forEach(i => { const k = i.origem !== 'extra' ? i.origem : i.item; (grupos[k] = grupos[k] || []).push(i); });
  const lista = Object.values(grupos).map(l => {
    l.sort((a, b) => a.mes.localeCompare(b.mes));
    const [p1, tot] = String(l[0].parcela).split('/').map(Number);
    return { nome: l[0].item, fim: l[l.length - 1].mes, mensal: Number(l[l.length - 1].valor_brl) || 0, resto: somaBRL(l), sub: `parcela ${p1} de ${tot}, termina em ${mesCurto(l[l.length - 1].mes)}` };
  }).sort((a, b) => a.fim.localeCompare(b.fim) || b.resto - a.resto);
  const total = porMes.reduce((a, b) => a + b, 0);
  const rot = meses.map(ms => ({ txt: MESES[Number(ms.slice(5)) - 1][0], atual: ms === st.hoje.slice(0, 7) }));
  return `<div class="card"><div class="tiles">
      <div><small>Falta pagar</small><b>${m(total)}</b></div>
      <div><small>Em ${esc(MESES[Number(atual.slice(5)) - 1].toLowerCase())}</small><b>${m(porMes[0])}</b></div>
      <div><small>Última parcela</small><b>${esc(mesCurto(meses[meses.length - 1]))}</b></div>
    </div></div>
    <div class="card"><h2>Parcelas por mês</h2>
      ${grafPilha('gParc', rot, [{ cor: COR_FIXA, vals: porMes }], meses.map((ms, k) => `<b>${esc(nomeMes(ms))}</b><br>Parcelas ${m(porMes[k])}`), 'Parcelas em aberto por mês')}
      <div class="aviso">De ${esc(nomeMes(meses[0]))} a ${esc(nomeMes(meses[meses.length - 1]))}. Só entra o que tem número de parcela; dívidas contínuas (sem parcela) e parcelas dentro das faturas de cartão ficam de fora.</div></div>
    <div class="card"><h2>Cada parcelamento (${lista.length})</h2>${listaBarras(lista.map(x => ({ nome: x.nome, sub: `${x.sub}, ${m(x.mensal)} por mês`, v: x.resto, cor: COR_FIXA })))}
      <div class="aviso">O valor é quanto ainda falta pagar de cada um.</div></div>`;
}

function resDolar(ano) {
  const meses = mesesDoAno(ano);
  const emDolar = st.itens.filter(i => i.tipo === 'Receita' && i.moeda === 'USD' && i.mes.startsWith(ano) && doFiltro(i));
  if (!emDolar.length) return '<div class="card"><p class="vazio">Nenhuma receita em dólar neste ano para esse filtro.</p></div>';
  const linhas = meses.map(ms => {
    const l = emDolar.filter(i => i.mes === ms), dol = l.reduce((t, i) => t + Number(i.valor), 0), reais = somaBRL(l);
    const real = l.some(i => !segueRef(i));
    const efeito = l.reduce((t, i) => t + (segueRef(i) ? 0 : Number(i.valor) * (Number(i.cambio) - Number(st.cambios[ms]))), 0);
    return { ms, dol, reais, cambio: dol ? reais / dol : null, real, efeito };
  });
  const comDolar = linhas.filter(x => x.dol);
  const tDol = comDolar.reduce((t, x) => t + x.dol, 0), tReais = comDolar.reduce((t, x) => t + x.reais, 0), tEf = comDolar.reduce((t, x) => t + x.efeito, 0);
  const rot = rotMeses(meses);
  return `<div class="card"><div class="tiles">
      <div><small>Em dólar</small><b>${st.oculto ? 'US$ ••••' : usd(tDol)}</b></div>
      <div><small>Em reais</small><b class="verde">${m(tReais)}</b></div>
      <div><small>Câmbio médio</small><b>${fmtCambio(tReais / tDol)}</b></div>
    </div></div>
    <div class="card"><h2>Câmbio de cada mês</h2>
      ${grafLinha('gDolar', rot, linhas.map(x => x.cambio), linhas.map(x => x.real),
        linhas.map(x => x.dol ? `<b>${esc(nomeMes(x.ms))}</b><br>US$ ${usd(x.dol).replace('US$ ', '')} a ${fmtCambio(x.cambio)}<br>${m(x.reais)}${x.real ? '<br>câmbio real' : '<br>referência do mês'}` : `<b>${esc(nomeMes(x.ms))}</b><br>sem receita em dólar`),
        'Câmbio de cada mês', v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}
      <div class="aviso">Marcador cheio: câmbio real registrado. Vazado: câmbio de referência do mês.</div></div>
    <div class="card"><h2>Mês a mês</h2>
      <table class="anual"><thead><tr><th>Mês</th><th>US$</th><th>Câmbio</th><th>R$</th><th>Efeito</th></tr></thead><tbody>
      ${comDolar.map(x => `<tr data-mes="${x.ms}"><td>${MESES[Number(x.ms.slice(5)) - 1].slice(0, 3)}</td><td>${milhar(x.dol)}</td><td>${fmtCambio(x.cambio)}</td><td>${milhar(x.reais)}</td>
        <td class="${x.efeito < 0 ? 'vermelho' : x.efeito > 0 ? 'verde' : ''}">${x.real ? milhar(x.efeito) : ''}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Ano</td><td>${milhar(tDol)}</td><td>${fmtCambio(tReais / tDol)}</td><td>${milhar(tReais)}</td><td>${milhar(tEf)}</td></tr></tfoot></table>
      <div class="aviso">Efeito: quanto o câmbio real deu a mais (ou a menos) em reais do que a referência do mês. Mês sem câmbio real fica em branco.</div></div>`;
}

// Dica ao tocar ou passar o mouse em qualquer gráfico; seções e linhas de tabela.
function ligarResumo() {
  document.querySelectorAll('.graf').forEach(g => {
    const dica = g.querySelector('.dica'), lista = (st.dicas || {})[g.id] || [], alvosG = g.querySelectorAll('[data-k]');
    const mostrar = el => {
      alvosG.forEach(a => a.classList.toggle('on', a === el));
      dica.innerHTML = lista[Number(el.dataset.k)] || '';
      dica.style.display = 'block';
      const caixa = g.getBoundingClientRect(), r = el.getBoundingClientRect(), w = dica.offsetWidth;
      dica.style.left = Math.max(0, Math.min(caixa.width - w, r.left - caixa.left + r.width / 2 - w / 2)) + 'px';
      dica.style.top = (r.top - caixa.top - 8) + 'px';
    };
    alvosG.forEach(el => { el.onpointerenter = () => mostrar(el); el.onclick = () => mostrar(el); });
    g.onpointerleave = () => { dica.style.display = 'none'; alvosG.forEach(a => a.classList.remove('on')); };

// ---------- avisos no Google Tasks ----------
// Decisão do João (01/11/2026): aviso na véspera, todas as contas, no Google Tasks de cada um. A lista do dono do script
// é atualizada pelo servidor de hora em hora; a da Carol, pelo app, quando ela toca (o Google exige o toque para liberar
// o acesso ao Tasks). Cada tarefa leva "fin:<id>" nas notas; mesma regra do servidor.
const DONO = 'joaoportilho@gmail.com';
const API_TASKS = 'https://tasks.googleapis.com/tasks/v1';
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function contasParaAviso() {
  const ate = somaDias(st.hoje, 35), desde = somaDias(st.hoje, -60);
  return st.itens.filter(o => o.tipo === 'Despesa' && o.pago !== true && Number(o.valor_brl) > 0
    && /^\d{4}-\d{2}-\d{2}$/.test(String(o.vencimento)) && o.vencimento >= desde && o.vencimento <= ate);
}
const tarefaDe = o => ({
  title: `${o.item}: ${brl(o.valor_brl).replace(/\s/g, ' ')} (vence ${dataBR(o.vencimento)})`,
  notes: `${o.pessoa}${o.forma_pgto ? ', ' + o.forma_pgto : ''}. Abrir o app: https://joaoportilho1909.github.io/financas/\nfin:${o.id}`,
  due: somaDias(o.vencimento, -1) + 'T00:00:00.000Z',
});
const ultimosAvisos = () => { const t = Number(ler('fin_avisos_em')); return t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; };
const precisaAvisos = () => st.usuario !== DONO && Date.now() - (Number(ler('fin_avisos_em')) || 0) > 20 * 3600e3 && contasParaAviso().length > 0;

function tokenTasks() {
  return new Promise((ok, falha) => {
    if (!window.google || !google.accounts || !google.accounts.oauth2) return falha(new Error('Login do Google ainda carregando, tente de novo'));
    google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/tasks', hint: st.usuario,
      callback: r => (r.error ? falha(new Error('Acesso ao Tasks: ' + r.error)) : ok(r.access_token)),
      error_callback: e => falha(new Error('Acesso ao Tasks: ' + (e.message || e.type))),
    }).requestAccessToken({ prompt: '' });
  });
}
async function gt(token, metodo, caminho, corpo) {
  const r = await fetch(API_TASKS + caminho, { method: metodo, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined });
  if (!r.ok) throw new Error('Google Tasks respondeu ' + r.status);
  return r.status === 204 ? null : r.json();
}
async function sincronizarMeusAvisos() {
  const token = await tokenTasks();
  const listas = (await gt(token, 'GET', '/users/@me/lists?maxResults=100')).items || [];
  const lista = (listas.find(x => x.title === 'Finanças') || (await gt(token, 'POST', '/users/@me/lists', { title: 'Finanças' }))).id;
  const existentes = [];
  let pagina = '';
  do {
    const r = await gt(token, 'GET', `/lists/${lista}/tasks?showCompleted=true&showHidden=true&maxResults=100${pagina ? '&pageToken=' + pagina : ''}`);
    (r.items || []).forEach(x => existentes.push(x));
    pagina = r.nextPageToken || '';
  } while (pagina);
  const alvo = Object.fromEntries(contasParaAviso().map(o => [o.id, o])), porId = Object.fromEntries(st.itens.map(o => [o.id, o]));
  const n = { criadas: 0, atualizadas: 0, concluidas: 0, removidas: 0 };
  for (const x of existentes) {
    const mm = String(x.notes || '').match(/fin:(L\d+)/);
    if (!mm) continue;
    const id = mm[1], o = alvo[id], l = porId[id];
    if (!o) {
      if (l && l.pago === true) { if (x.status !== 'completed') { await gt(token, 'PATCH', `/lists/${lista}/tasks/${x.id}`, { status: 'completed' }); n.concluidas++; } }
      else if (!l || x.status !== 'completed') { await gt(token, 'DELETE', `/lists/${lista}/tasks/${x.id}`); n.removidas++; }
      continue;
    }
    delete alvo[id];
    const t = tarefaDe(o);
    if (x.title !== t.title || String(x.due || '').slice(0, 10) !== t.due.slice(0, 10) || x.notes !== t.notes) { await gt(token, 'PATCH', `/lists/${lista}/tasks/${x.id}`, t); n.atualizadas++; }
  }
  for (const o of Object.values(alvo)) { await gt(token, 'POST', `/lists/${lista}/tasks`, tarefaDe(o)); n.criadas++; }
  guardar('fin_avisos_em', String(Date.now()));
  return n;
}
const resumoAvisos = n => {
  const p = [[n.criadas, 'criada', 'criadas'], [n.atualizadas, 'atualizada', 'atualizadas'], [n.concluidas, 'concluída', 'concluídas'], [n.removidas, 'removida', 'removidas']]
    .filter(x => x[0]).map(x => `${x[0]} ${x[0] === 1 ? x[1] : x[2]}`);
  return p.length ? 'Avisos: ' + p.join(', ') : 'Avisos já estavam em dia';
};
async function atualizarAvisos(el) {
  if (el.dataset.ocupado) return;
  el.dataset.ocupado = '1'; toast('Atualizando avisos…');
  try {
    const n = st.usuario === DONO ? await call('sincronizarAvisos') : await sincronizarMeusAvisos();
    toast(resumoAvisos(n)); render(); if ($('fundo').classList.contains('on') && $('bAvisos')) mais();
  } catch (err) { erro(err); }
  delete el.dataset.ocupado;
}

const TIPOS_MOV = ['Transferência', 'Aplicação', 'Resgate', 'Outro'];
// Sugestão de conta: primeiro a lista oficial (Cadastros > Contas, na ordem de lá), depois outras já usadas; dá para digitar outra.
const contasConhecidas = () => {
  const oficiais = st.cad['Contas'] || [];
  const usadas = [...(st.saldos || []).map(x => x.conta), ...(st.movs || []).flatMap(x => [x.de, x.para])]
    .map(x => String(x || '').trim()).filter(x => x && x !== 'Pix' && !oficiais.includes(x)).sort((a, b) => a.localeCompare(b));
  return [...new Set(oficiais.concat(usadas))];
};
// Último saldo de cada conta (data mais recente; no mesmo dia, o lançado por último).
function saldosAtuais() {
  const u = {};
  (st.saldos || []).forEach(x => { const k = String(x.conta).trim(), a = u[k]; if (!a || String(x.data) > String(a.data) || (x.data === a.data && String(x.criado_em) >= String(a.criado_em))) u[k] = x; });
  const ref = Number(st.cambios[mesAtual()]) || 0;
  return Object.values(u).sort((a, b) => (b.moeda === 'USD' ? b.valor * ref : b.valor) - (a.moeda === 'USD' ? a.valor * ref : a.valor));
}

    <div class="aviso">Cada conta mostra o último saldo informado, com a data. O total soma esses saldos, mesmo de datas diferentes${temDolar ? `, e converte o saldo em dólar pela referência de ${esc(nomeMes(mesAtual()))} (${fmtCambio(ref)})` : ''}.</div>

    ${cambio ? '<div class="aviso">Excluir um câmbio não desfaz o câmbio aplicado ao lançamento em dólar.</div>' : ''}
    <button class="btn perigo" id="bMovExcluir">Excluir movimentação</button>
    <button class="btn" id="bVoltar">Voltar</button>`);
  $('bVoltar').onclick = telaMov;
  $('bMovExcluir').onclick = async e => {
    if (e.target.dataset.conf !== '1') { e.target.dataset.conf = '1'; e.target.textContent = 'Toque de novo para excluir'; return; }
    e.target.disabled = true;
    try { await call('excluirMovimentacao', id); st.movs = st.movs.filter(v => v.id !== id); telaMov(); toast('Excluída'); }
    catch (err) { erro(err); e.target.disabled = false; }
  };
}

function novoSaldo() {
  abrirFolha(`
    <h3>Saldo de uma conta</h3>
    <div class="campo"><label>Conta</label><input id="sConta" list="contas" autocomplete="off" placeholder="Ex.: C6, conta"></div>
    <div class="linha2">
      <div class="campo"><label>Saldo</label><input id="sValor" inputmode="decimal" placeholder="0,00"></div>
      <div class="campo"><label>Moeda</label><select id="sMoeda"><option value="BRL">R$</option><option value="USD">US$</option></select></div>
    </div>
    <div class="campo"><label>Data</label><input id="sData" type="date" value="${st.hoje}"></div>
    <div class="campo"><label>Observação (opcional)</label><textarea id="sObs" rows="2"></textarea></div>
    ${listaContas()}
    <button class="btn pri" id="bSaldoSalvar">Salvar</button>
    <button class="btn" id="bVoltar">Voltar</button>`);
  $('bVoltar').onclick = telaMov;
  $('sConta').oninput = () => { if (/US\$|USD|global/i.test($('sConta').value)) $('sMoeda').value = 'USD'; };
  $('bSaldoSalvar').onclick = async e => {
    const valor = numero($('sValor').value);
    if (!$('sConta').value.trim()) return toast('Preencha a conta');
    if (!isFinite(valor) || $('sValor').value.trim() === '') return toast('Valor inválido');
    e.target.disabled = true; e.target.textContent = 'Gravando…';
    try {
      const o = await call('registrarSaldo', { conta: $('sConta').value.trim(), valor, moeda: $('sMoeda').value, data: $('sData').value, obs: $('sObs').value.trim() });
      (st.saldos = st.saldos || []).push(o);
      telaMov(); toast('Saldo registrado');
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Salvar'; }
  };
}

function novo() {
  const hojeNoMes = st.hoje.slice(0, 7) === st.mes ? st.hoje : st.mes + '-01';
  const opts = (lista, sel) => lista.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const formas = (st.cad['Forma Pgto'] || []).filter(f => f !== 'Crédito');
  abrirFolha(`
    <h3>Novo lançamento</h3>
    <div class="seg" id="tipo"><button class="on" data-v="Despesa">Despesa</button><button data-v="Receita">Receita</button></div>
    <div class="campo"><label>Item</label><input id="nItem" placeholder="Ex.: Farmácia, conserto, presente"></div>
    <div class="linha2">
      <div class="campo"><label>Valor</label><input id="nValor" inputmode="decimal" placeholder="0,00"></div>
      <div class="campo"><label>Moeda</label><select id="nMoeda">${opts(st.cad['Moeda'] || ['BRL'], 'BRL')}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Data</label><input id="nData" type="date" value="${hojeNoMes}"></div>
      <div class="campo"><label>Mês da planilha</label><select id="nMes">${st.meses.map(m => `<option value="${m}" ${m === st.mes ? 'selected' : ''}>${nomeMes(m)}</option>`).join('')}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Pessoa</label><select id="nPessoa">${opts(st.cad['Pessoas'] || [], 'Gerais')}</select></div>
      <div class="campo"><label>Forma</label><select id="nForma">${opts(formas, 'PIX')}</select></div>
    </div>
    <div class="campo"><label>Categoria</label><select id="nCat">${opts(st.cad['Categorias'] || [], 'Outros')}</select></div>
    <div class="aviso">Compra no cartão de crédito não entra aqui: ela vem pela fatura do cartão.</div>
    <label class="check"><input type="checkbox" id="nPago" checked> Já está pago</label>
    <div class="campo"><label>Comprovante (opcional)</label><input type="file" id="nArq" accept="${ACEITA}"></div>
    <div class="campo"><label>Observação (opcional)</label><textarea id="nObs" rows="2"></textarea></div>
    <button class="btn pri" id="bSalvar">Salvar</button>
    <button class="btn" onclick="fecharFolha()">Cancelar</button>`);
  let tipo = 'Despesa';
  document.querySelectorAll('#tipo button').forEach(b => b.onclick = () => {
    tipo = b.dataset.v; document.querySelectorAll('#tipo button').forEach(x => x.classList.toggle('on', x === b));
    $('nPago').parentNode.lastChild.textContent = tipo === 'Receita' ? ' Já foi recebido' : ' Já está pago';
  });
  $('bSalvar').onclick = async e => {
    const valor = numero($('nValor').value);
    if (!$('nItem').value.trim()) return toast('Preencha o item');
    if (!isFinite(valor) || $('nValor').value.trim() === '') return toast('Valor inválido');
    e.target.disabled = true;
    try {
      let o = await call('criarLancamento', {
        tipo, item: $('nItem').value.trim(), valor, moeda: $('nMoeda').value, data: $('nData').value, mes: $('nMes').value,
        pessoa: $('nPessoa').value, forma_pgto: $('nForma').value, categoria: $('nCat').value, pago: $('nPago').checked, obs: $('nObs').value.trim(),
      });
      const f = $('nArq').files[0];
      if (f) { toast('Enviando comprovante…'); const a = await prepararArquivo(f); o = await call('anexarComprovante', o.id, a.nome, a.mime, a.b64); }
      fecharFolha();
      st.mes = o.mes; atualizarItem(o);
      toast('Lançado');
    } catch (err) { erro(err); e.target.disabled = false; }
  };
}

$('btnNovo').onclick = novo;
$('btnMais').onclick = mais;
document.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { st.aba = b.dataset.aba; render(); window.scrollTo(0, 0); });
$('ant').onclick = () => (st.aba === 'resumo' ? trocarAno(-1) : abrirMes(st.meses[st.meses.indexOf(st.mes) - 1]));
$('prox').onclick = () => (st.aba === 'resumo' ? trocarAno(1) : abrirMes(st.meses[st.meses.indexOf(st.mes) + 1]));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (SESSAO) carregarTudo(); else mostrarLogin();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisPronto()"></script>
</body>
</html>

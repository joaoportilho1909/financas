<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finanças</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --ink: #1f2430; --muted: #7d8494; --line: #e7eaf0;
    --acc: #2450b8; --acc-2: #3f6fe0; --acc-bg: #e2e9fb; --accent-ink: #ffffff;
    --green: #2f8a5b; --green-bg: #e3f2e9; --red: #c2402f; --red-bg: #fbe8e5;
    --shadow: 0 2px 12px rgba(20, 35, 70, .07); --r: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 4px 16px 110px; }

  .topo { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px 6px; }
  .mesnav { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .mesnav .mes { font-size: 19px; font-weight: 700; text-align: center; flex: 1; }
  .mesnav .mes small { color: var(--muted); font-weight: 500; font-size: 15px; }
  .nav { width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--card); box-shadow: var(--shadow);
    font-size: 20px; color: var(--acc); cursor: pointer; }
  .nav:disabled { opacity: .3; }

  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin: 12px 0; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 a { font-size: 13px; font-weight: 600; color: var(--acc); cursor: pointer; }

  .hero { text-align: center; padding: 18px 16px 16px; }
  .hero .rot { color: var(--muted); font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .olho { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; display: inline-flex; }
  .hero .saldo { font-size: 32px; font-weight: 750; letter-spacing: -.5px; margin: 2px 0 14px; }
  .hero .saldo.neg { color: var(--red); }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .duas div { display: flex; align-items: center; gap: 10px; }
  .duas small { display: block; color: var(--muted); font-size: 12px; }
  .duas b { font-size: 15px; }
  .bola { width: 38px; height: 38px; border-radius: 19px; display: inline-flex; align-items: center; justify-content: center;
    flex: none; font-size: 18px; }
  .bola.up { background: var(--green); color: #fff; } .bola.down { background: var(--red); color: #fff; }
  .verde { color: var(--green); } .vermelho { color: var(--red); }

  .barraprog { height: 8px; border-radius: 4px; background: var(--acc-bg); overflow: hidden; margin: 10px 0 8px; }
  .barraprog i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc-2)); border-radius: 4px; }
  .linhaprog { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .alerta { margin-top: 10px; font-size: 13px; color: var(--red); background: var(--red-bg); border-radius: 10px; padding: 8px 10px; cursor: pointer; }

  .rosca { display: flex; align-items: center; gap: 16px; }
  .rosca svg { flex: none; }
  .legenda { flex: 1; min-width: 0; }
  .legenda div { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .legenda span.ponto { width: 10px; height: 10px; border-radius: 5px; flex: none; }
  .legenda span.nome { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 5px 13px;
    white-space: nowrap; cursor: pointer; font-size: 13px; color: var(--muted); }
  .chip.on { background: var(--acc); color: var(--accent-ink); border-color: var(--acc); }

  .dia { font-size: 14px; font-weight: 700; margin: 18px 4px 6px; }
  .dia small { color: var(--muted); font-weight: 500; }
  .lista { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .card .lista { box-shadow: none; border-radius: 0; margin: 0 -16px -16px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .ico { width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 19px; flex: none; }
  .item .txt { flex: 1; min-width: 0; }
  .item .nome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 14.5px; }
  .item .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .val { text-align: right; white-space: nowrap; font-weight: 650; font-size: 14.5px; }
  .item .val .sub { font-weight: 400; }
  .estado { display: block; font-size: 11px; font-weight: 600; margin-top: 2px; }
  .estado.ok { color: var(--green); } .estado.venc { color: var(--red); } .estado.ab { color: var(--muted); font-weight: 500; }
  .item.pago .nome { color: var(--muted); }
  .vazio { padding: 14px; color: var(--muted); text-align: center; }

  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -2px 14px rgba(20,35,70,.08);
    display: flex; justify-content: space-around; align-items: center; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 6; }
  .barra button { background: none; border: 0; color: var(--muted); font-size: 11px; padding: 4px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; }
  .barra button svg { width: 22px; height: 22px; }
  .barra button.on { color: var(--acc); font-weight: 600; }
  .barra button:disabled { opacity: .45; }
  .barra .mais { width: 56px; height: 56px; min-width: 56px; border-radius: 28px; background: linear-gradient(135deg, var(--acc-2), var(--acc));
    color: #fff; font-size: 30px; line-height: 1; margin-top: -30px; box-shadow: 0 4px 14px rgba(36,80,184,.4); }

  .fundo { position: fixed; inset: 0; background: rgba(15,20,35,.35); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .fundo.on { display: flex; }
  .folha { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .folha h3 { margin: 0 0 4px; font-size: 18px; }
  .folha .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .campo { margin: 10px 0; }
  .campo label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .campo input, .campo select, .campo textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dados { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 8px 0; }
  .dados span:nth-child(odd) { color: var(--muted); }
  .btn { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    cursor: pointer; margin-top: 8px; font-weight: 600; }
  .btn.pri { background: linear-gradient(135deg, var(--acc-2), var(--acc)); color: #fff; border-color: var(--acc); }
  .btn.perigo { color: var(--red); }
  .btn:disabled { opacity: .5; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { flex: 1; padding: 9px; border: 0; background: var(--bg); cursor: pointer; }
  .seg button.on { background: var(--acc); color: #fff; }
  .check { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  .check input { width: 20px; height: 20px; accent-color: var(--acc); }
  .links a { display: block; color: var(--acc); margin: 2px 0; }
  .aviso { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .login { text-align: center; padding: 60px 0; }
  .login .marca { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--acc-2), var(--acc)); color: #fff; font-weight: 800; font-size: 26px; }
  .login #botaoGoogle { display: inline-block; margin-top: 10px; min-height: 44px; }
  .rodape { text-align: center; color: var(--muted); font-size: 12px; margin: 22px 0 8px; }
  .rodape button { background: none; border: 0; color: var(--acc); text-decoration: underline; cursor: pointer; padding: 0 4px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 9px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }
  .carregando { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--acc); transform: scaleX(0);
    transform-origin: left; transition: transform .3s; z-index: 30; }
  .carregando.on { transform: scaleX(.8); transition: transform 4s; }
  .erro { background: var(--red-bg); color: var(--red); padding: 12px; border-radius: 12px; margin: 16px 0; }
  .grade { margin: 6px 0; }
  .grade .g { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 3px 10px; padding: 6px 0; }
  .grade .g .ico { width: 32px; height: 32px; font-size: 15px; grid-row: span 2; }
  .grade .g .nome { font-size: 14px; }
  .grade .g b { font-size: 14px; }
  .grade .g .barra-cat { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--acc-bg); overflow: hidden; }
  .grade .g .barra-cat i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
  details.compras { font-size: 13px; margin: 8px 0; }
  details.compras summary { color: var(--acc); cursor: pointer; padding: 4px 0; }
  details.compras div { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  details.compras .d { color: var(--muted); width: 38px; flex: none; }
  details.compras .t { flex: 1; min-width: 0; }
  details.compras small { color: var(--muted); }
  label.btn, .campo label.btn { display: block; text-align: center; cursor: pointer; font-size: 15px; color: var(--ink); margin: 8px 0 0; }
  details.compras label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  details.compras label input { width: 20px; height: 20px; flex: none; margin: 2px 0 0; accent-color: var(--acc); }
  .bloco { margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  details.grupo summary { cursor: pointer; margin: 12px 0 4px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .tiles small { display: block; color: var(--muted); font-size: 12px; }
  .tiles b { font-size: 15px; }
  .graf { position: relative; }
  .graf svg { display: block; width: 100%; height: auto; overflow: visible; }
  .graf .eixo { font-size: 9px; fill: var(--muted); }
  .graf .eixo.atual { fill: var(--ink); font-weight: 700; }
  .graf .alvo { fill: transparent; cursor: pointer; }
  .graf .alvo.on { fill: rgba(36, 80, 184, .07); }
  .dica { position: absolute; top: 0; transform: translateY(-100%); background: var(--ink); color: #fff; font-size: 12px; line-height: 1.5; border-radius: 10px;
    padding: 6px 9px; pointer-events: none; white-space: nowrap; display: none; z-index: 2; }
  .dica b { color: #fff; }
  .leg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .leg span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  table.anual { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.anual th { color: var(--muted); font-weight: 500; text-align: right; padding: 4px 2px; }
  table.anual th:first-child, table.anual td:first-child { text-align: left; }
  table.anual td { text-align: right; padding: 7px 2px; border-top: 1px solid var(--line); }
  table.anual tr[data-mes] { cursor: pointer; }
  table.anual tr.atual td { font-weight: 700; }
  table.anual tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
  .grade .g.sem-ico { grid-template-columns: 1fr auto; }
  .grade .g.sem-ico .barra-cat { grid-column: 1 / 3; }
  .grade .g.sem-ico small { color: var(--muted); font-size: 12px; }
  .ponto { display: inline-block; width: 10px; height: 10px; border-radius: 5px; vertical-align: 0; }
  .graf svg path, .graf svg line, .graf svg text, .graf svg circle, .graf svg rect:not(.alvo):not(.cel) { pointer-events: none; }
  .graf .cel { cursor: pointer; }
  .graf .cel.on { stroke: var(--ink); stroke-width: 1.5; }
  .chips.secoes { flex-wrap: wrap; overflow: visible; }
  .card.avisos { display: flex; gap: 10px; align-items: center; cursor: pointer; color: var(--acc); font-weight: 600; font-size: 14px; padding: 14px 16px; }
</style>
</head>
<body>
<div class="carregando" id="carregando"></div>
<div class="topo"><div class="mesnav">
  <button class="nav" id="ant" aria-label="Mês anterior">‹</button>
  <div class="mes" id="titulo">Finanças</div>
  <button class="nav" id="prox" aria-label="Próximo mês">›</button>
</div></div>
<div class="wrap"><div id="conteudo"><p class="vazio">Carregando…</p></div></div>

<nav class="barra">
  <button class="on" data-aba="principal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Principal</span></button>
  <button data-aba="transacoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Transações</span></button>
  <button class="mais" id="btnNovo" aria-label="Novo lançamento">+</button>
  <button data-aba="resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Resumo</span></button>
  <button id="btnMais"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>Mais</span></button>
</nav>

<div class="fundo" id="fundo"><div class="folha" id="folha"></div></div>
<div class="toast" id="toast"></div>

<script>
window.onerror =(msg, src, linha) => { document.getElementById('conteudo').insertAdjacentHTML('beforeend', `<div class="erro">Erro na tela: ${msg} (linha ${linha})</div>`); };
window.addEventListener('unhandledrejection', e => { document.getElementById('conteudo').insertAdjacentHTML('beforeend', `<div class="erro">Erro: ${(e.reason && e.reason.message) || e.reason}</div>`); });
</script>
<script>
// Servidor = Apps Script publicado como API; login = "Entrar com Google" (ID token), conferido no servidor.
const API = 'https://script.google.com/macros/s/AKfycbwcof9mClbEJ8aW3iwMsk7rkNIlT2NVMCO2H2WpSdItzOM5l-_-7vPhAMx12olSxji1zA/exec';
const CLIENT_ID = '761338018924-50mt0begrbrlfpl5dg6g81rvdmghf89n.apps.googleusercontent.com';
const ACEITA = 'image/' + '*,application/pdf';
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const st = { pessoa: 'Todos', situacao: 'Todos' };
const $ = id => document.getElementById(id);

// ---------- login ----------

// A sessão (30 dias) fica guardada neste aparelho; o "Entrar com Google" só aparece no primeiro acesso ou depois de sair.
const guardar = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
let SESSAO = ler('fin_sessao');

function mostrarLogin(msg) {
  SESSAO = null; guardar('fin_sessao', null);
  $('titulo').textContent = 'Finanças';
  $('conteudo').innerHTML = `<div class="login"><img class="marca" src="icon-192.png" alt=""><p>Entre com a sua conta Google.</p>${msg ? `<div class="erro">${esc(msg)}</div>` : ''}<div id="botaoGoogle"></div></div>`;
  desenharBotao();
}
function desenharBotao() {
  if ($('botaoGoogle') && window.google && google.accounts) {
    google.accounts.id.renderButton($('botaoGoogle'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', locale: 'pt-BR' });
  }
}

// Chamado pelo script do Google (gsi/client) quando termina de carregar.
function gisPronto() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => entrar(r.credential) });
  desenharBotao();
}

async function entrar(idToken) {
  try {
    const d = await post({ acao: 'entrar', idToken });
    SESSAO = d.sessao; guardar('fin_sessao', SESSAO);
    carregarTudo();
  } catch (e) { mostrarLogin(e.message); }
}

function sair() {
  mostrarLogin();
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
}

// ---------- servidor ----------

async function post(corpo) {
  $('carregando').classList.add('on');
  const espera = setTimeout(() => toast('O servidor está demorando…'), 15000);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(corpo) });
    const j = await r.json();
    if (!j.ok) { const e = new Error(j.erro); e.login = j.login; throw e; }
    return j.dados;
  } finally { clearTimeout(espera); $('carregando').classList.remove('on'); }
}

async function call(acao, ...args) {
  if (!SESSAO) { mostrarLogin(); throw new Error('Faça login'); }
  try { return await post({ sessao: SESSAO, acao, args }); }
  catch (e) { if (e.login) mostrarLogin(e.message); throw e; }
}
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const usd = n => 'US$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dataBR = s => (s && /^\d{4}-\d{2}-\d{2}/.test(s)) ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const nomeMes = m => MESES[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const numero = s => { s = String(s).trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s); };
const quemCurto = e => !e ? '' : e === st.usuario ? 'você' : e.split('@')[0];

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2500); }
function erro(e) { toast((e && e.message) || String(e)); }

// Busca o banco inteiro uma vez; trocar de mês é local. Recarrega ao voltar para o app (pega o que a outra pessoa lançou).
let carregadoEm = 0;
async function carregarTudo() {
  try {
    const d = await call('carregar');
    Object.assign(st, d);
    if (!st.mes || st.meses.indexOf(st.mes) < 0) {
      const atual = st.hoje.slice(0, 7);
      st.mes = st.meses.indexOf(atual) >= 0 ? atual : st.meses[st.meses.length - 1];
    }
    carregadoEm = Date.now();
    render();
  } catch (e) {
    if (!$('botaoGoogle')) $('conteudo').innerHTML = `<div class="erro">Não consegui abrir o banco de dados.<br><small>${esc(e.message || e)}</small></div>`;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && SESSAO && carregadoEm && Date.now() - carregadoEm > 60000 && !$('fundo').classList.contains('on')) carregarTudo();
});

function abrirMes(mes) { st.mes = mes; render(); window.scrollTo(0, 0); }

function filtrados() {
  return st.itens.filter(i => i.mes === st.mes && (st.pessoa === 'Todos' || i.pessoa === st.pessoa));
}

// ---------- telas ----------

const CAT = {
  'Cartões de Crédito': ['💳', '#efe6d2'], 'Contas (água/luz/internet)': ['💡', '#fdf1cf'], 'Dívidas/Parcelas': ['🧾', '#ece7f6'],
  'Educação': ['🎓', '#e3edf7'], 'Empresa': ['💼', '#e8e6e1'], 'Impostos': ['🏛️', '#ebe9e4'], 'Investimentos': ['📈', '#e3f2e9'],

function totais(itens) {
  const soma = f => itens.filter(f).reduce((s, i) => s + (Number(i.valor_brl) || 0), 0);
  const desp = soma(i => i.tipo === 'Despesa'), pago = soma(i => i.tipo === 'Despesa' && i.pago);
  const abertas = itens.filter(i => i.tipo === 'Despesa' && !i.pago && Number(i.valor_brl) > 0);
  return { rec: soma(i => i.tipo === 'Receita'), desp, pago, abertas, vencidas: abertas.filter(vencida) };
}
const vencida = i => !i.pago && i.vencimento && i.vencimento < st.hoje && i.tipo === 'Despesa' && Number(i.valor_brl) > 0;

function rosca(cats) {
  const total = cats.reduce((s, c) => s + c[1], 0), R = 44, C = 2 * Math.PI * R;
  let acum = 0;
  const arcos = cats.map((c, n) => {
    const len = C * c[1] / total;
    const a = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${CORES[n % CORES.length]}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acum}" transform="rotate(-90 60 60)"/>`;
    acum += len; return a;
  }).join('');
  return `<svg width="120" height="120" viewBox="0 0 120 120">${arcos}<text x="60" y="57" text-anchor="middle" font-size="10" fill="#7d8494">Total</text><text x="60" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2430">${st.oculto ? '••••' : (total / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil'}</text></svg>`;
}

function telaTransacoes() {
  const itens = filtrados();

  const lista = itens.filter(ok).sort((a, b) => (a.vencimento || '9999').localeCompare(b.vencimento || '9999') || (a.tipo === 'Receita' ? -1 : 1));
  const t = totais(itens);

      <div><small style="color:var(--muted)">Receitas</small><br><b class="verde">${m(t.rec)}</b></div>
      <div><small style="color:var(--muted)">Despesas</small><br><b class="vermelho">${m(t.desp)}</b></div>
      <div><small style="color:var(--muted)">A pagar</small><br><b>${m(t.desp - t.pago)}</b></div>
    </div>`;
  if (!lista.length) return h + '<p class="vazio">Nada aqui com esses filtros.</p>';
  const grupos = [];
  lista.forEach(i => { const d = i.vencimento || ''; const g = grupos[grupos.length - 1]; if (g && g.d === d) g.itens.push(i); else grupos.push({ d, itens: [i] }); });
  const amanha = new Date(st.hoje + 'T12:00:00'); amanha.setDate(amanha.getDate() + 1);
  const amanhaS = amanha.toISOString().slice(0, 10);
  grupos.forEach(g => {

    if (g.d) {

    }
    h += `<div class="dia">${rot}</div><div class="lista">${g.itens.map(linha).join('')}</div>`;
  });
  return h;
}

function linha(i) {

    catch (err) { erro(err); e.target.disabled = false; }
  };
}

// Foto do celular é reduzida para no máximo 1600 px antes de subir; PDF vai como está.
function prepararArquivo(f) {
  return new Promise((ok, falha) => {
    if (/^image\/(jpeg|png|webp|heic|heif)/.test(f.type)) {
      const img = new Image();
      img.onload = () => {
        const fator = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * fator); c.height = Math.round(img.height * fator);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ b64: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg', nome: 'comprovante.jpg' });
      };
      img.onerror = () => lerCru(f).then(ok, falha);
      img.src = URL.createObjectURL(f);
    } else lerCru(f).then(ok, falha);
  });
}
function lerCru(f) {
  return new Promise((ok, falha) => {
    if (f.size > 20 * 1024 * 1024) return falha(new Error('Arquivo maior que 20 MB'));
    const r = new FileReader();
    r.onload = () => ok({ b64: r.result.split(',')[1], mime: f.type || 'application/octet-stream', nome: f.name });
    r.onerror = () => falha(r.error); r.readAsDataURL(f);
  });
}

function lerCSV(texto) {
  const linhas = []; let campo = '', linha = [], aspas = false;
  texto = texto.replace(/^\uFEFF/, '');
  const fecha = () => { linha.push(campo); campo = ''; if (linha.some(x => x.trim())) linhas.push(linha); linha = []; };
  for (let k = 0; k < texto.length; k++) {
    const c = texto[k];
    if (aspas) {
      if (c !== '"') campo += c;
      else if (texto[k + 1] === '"') { campo += '"'; k++; }
      else aspas = false;
    } else if (c === '"') aspas = true;
    else if (c === ',') { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[k + 1] === '\n') k++; fecha(); }
    else campo += c;
  }
  fecha();
  return linhas;
}

// Fatura do cartão Nubank: colunas date,title,amount; pagamento vem negativo ("- 500,39"); parcela no fim do título.
function lerFaturaNubank(texto) {
  const t = lerCSV(texto);
  const cab = (t[0] || []).map(x => x.trim().toLowerCase());
  const [cd, ct, ca] = ['date', 'title', 'amount'].map(k => cab.indexOf(k));
  if (cd < 0 || ct < 0 || ca < 0) throw new Error('Não reconheci o arquivo. Use o CSV da fatura do cartão Nubank (colunas date, title, amount).');
  const linhas = t.slice(1).map(r => {
    const data = String(r[cd] || '').trim(), valor = numero(String(r[ca] || '').replace(/\s/g, ''));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data) || !isFinite(valor)) throw new Error('Linha que não entendi: ' + r.join(','));
    let desc = String(r[ct] || '').trim(), parcela = '';
    const p = desc.match(/\s*-\s*Parcela (\d+\/\d+)\s*$/i);
    if (p) { parcela = p[1]; desc = desc.slice(0, p.index).trim(); }
    const tipo = /^pagamento recebido/i.test(desc) ? 'pagamento' : /^iof de/i.test(desc) ? 'iof' : valor < 0 ? 'estorno' : 'compra';
    return { data, descricao: desc, parcela, tipo, categoria: tipo === 'pagamento' ? '' : categoriaDe(desc), valor: Math.round(valor * 100) / 100 };
  });
  if (!linhas.length) throw new Error('O arquivo não tem lançamentos.');
  return linhas;
}

// Por enquanto só estes cartões importam fatura (decisão do João, 31/10/2026); o leitor do BB espera a amostra.
const IMPORTA_FATURA = ['Cartão Nubank João', 'Cartão Nubank Carol', 'Cartão BB'];
const comprasDe = id => (st.compras || []).filter(c => c.lanc_id === id);
// Soma por categoria: compras, IOF e estornos; pagamento antecipado fica de fora.
function gradeCategorias(cs) {
  const g = {};
  cs.filter(c => c.tipo !== 'pagamento' && c.tipo !== 'saldo').forEach(c => { const k = c.categoria || 'Outros'; g[k] = (g[k] || 0) + Number(c.valor); });
  return Object.entries(g).filter(c => Math.abs(c[1]) >= 0.005).sort((a, b) => b[1] - a[1]);
}
function htmlGrade(cats) {
  const max = Math.max(1, ...cats.map(c => c[1]));
  return `<div class="grade">${cats.map(([c, v]) => `<div class="g">${icone({ categoria: c })}<span class="nome">${esc(c)}</span><b>${m(v)}</b><span class="barra-cat"><i style="width:${Math.max(0, 100 * v / max).toFixed(1)}%"></i></span></div>`).join('')}</div>`;
}
function listaCompras(cs) {
  return cs.slice().sort((a, b) => b.data.localeCompare(a.data)).map(c => `<div><span class="d">${dataBR(c.data)}</span><span class="t">${esc(c.descricao)}${c.parcela ? ' <small>' + esc(c.parcela) + '</small>' : ''}<br><small>${esc(c.categoria || (c.tipo === 'saldo' ? 'saldo anterior' : 'pagamento'))}</small></span><b>${m(c.valor)}</b></div>`).join('');
}

function secaoFatura(i) {
  const cs = comprasDe(i.id);
  const pag = cs.filter(c => c.tipo === 'pagamento').reduce((s, c) => s + Number(c.valor), 0);
  let h = '<div class="campo"><label>Fatura por categoria</label>';
  if (cs.length) {
    h += htmlGrade(gradeCategorias(cs));
    if (pag) h += `<div class="aviso">Pagamentos antecipados na fatura: ${m(pag)}</div>`;
    h += `<details class="compras"><summary>Ver as ${cs.length} linhas (importado por ${esc(quemCurto(cs[0].importado_por))} em ${esc(dataBR(cs[0].importado_em) + ' às ' + String(cs[0].importado_em).slice(11))})</summary>${listaCompras(cs)}</details>`;
  } else h += '<div class="aviso" style="margin-bottom:8px">Nenhuma fatura importada para este mês.</div>';
  return h + `<label class="btn">${cs.length ? 'Importar de novo' : 'Importar fatura'} (CSV do Nubank ou PDF do BB)<input type="file" id="arqFatura" accept=".csv,text/csv,.pdf,application/pdf" hidden></label></div>`;
}

// Mostra o que vai ser gravado; só grava ao confirmar.
// fat = { banco, linhas, total (se o arquivo traz o total; senão é a soma das linhas), avisos }.
function previaFatura(i, fat, arquivo) {
  const linhas = fat.linhas;
  const soma = Math.round(linhas.reduce((s, l) => s + l.valor, 0) * 100) / 100;
  const total = fat.total === undefined ? soma : fat.total;
  const pag = linhas.filter(l => l.tipo === 'pagamento').reduce((s, l) => s + l.valor, 0);
  const saldo = linhas.filter(l => l.tipo === 'saldo').reduce((s, l) => s + l.valor, 0);
  const datas = linhas.filter(l => l.tipo !== 'saldo').map(l => l.data).sort();
  const antes = comprasDe(i.id).length;
  const avisos = (fat.avisos || []).slice();
  if (!new RegExp(fat.banco === 'BB' ? '\\bBB\\b' : fat.banco, 'i').test(i.item)) avisos.push(`Esse cartão não parece ser ${fat.banco} (${i.item}).`);
  if (Math.abs(soma - total) > 0.01) avisos.push(`As linhas somam ${brl(soma)} e o total da fatura é ${brl(total)}. Confira antes de importar.`);
  if (i.vencimento && datas[datas.length - 1] > i.vencimento) avisos.push(`Tem compra depois do vencimento (${dataBR(i.vencimento)}). Confira se é o mês certo.`);
  if (antes) avisos.push(`Substitui a importação anterior (${antes} linhas).`);
  abrirFolha(`
    <h3>Importar fatura</h3>
    <div class="sub">${esc(i.item)} · ${esc(nomeMes(i.mes))}</div>
    <div class="dados">
      <span>Arquivo</span><span>${esc(arquivo)}</span>
      <span>Banco</span><span>${esc(fat.banco)}</span>
      ${saldo ? `<span>Saldo anterior</span><span>${brl(saldo)}</span>` : ''}
      <span>Compras</span><span>${linhas.filter(l => l.tipo !== 'pagamento' && l.tipo !== 'saldo').length}, de ${dataBR(datas[0])} a ${dataBR(datas[datas.length - 1])}</span>
      ${pag ? `<span>Pagamentos</span><span>${brl(pag)}</span>` : ''}
      <span>Total da fatura</span><span><b>${brl(total)}</b></span>
      <span>Valor do mês hoje</span><span>${brl(i.valor_brl)}</span>
    </div>
    ${htmlGrade(gradeCategorias(linhas))}
    ${avisos.map(a => `<div class="alerta">${esc(a)}</div>`).join('')}
    <div class="campo"><label>Valor do mês do cartão (R$). Se o PDF da fatura der outro total, corrija aqui.</label>
      <input id="totFat" inputmode="decimal" value="${total.toFixed(2).replace('.', ',')}"></div>
    <button class="btn pri" id="bImp">Confirmar importação</button>
    <details class="compras"><summary>Ver as ${linhas.length} linhas</summary>${listaCompras(linhas)}</details>
    <button class="btn" id="bVoltar">Voltar</button>`);
  $('bVoltar').onclick = () => detalhe(i.id);
  $('bImp').onclick = async e => {
    const t = numero($('totFat').value);
    if (!isFinite(t) || $('totFat').value.trim() === '') return toast('Total inválido');
    e.target.disabled = true; e.target.textContent = 'Gravando…';
    try {
      const r = await call('importarFatura', i.id, t, linhas, arquivo);
      st.compras = (st.compras || []).filter(c => c.lanc_id !== i.id).concat(r.compras);
      atualizarItem(r.item); detalhe(i.id); toast('Fatura importada');
    } catch (err) { erro(err); e.target.disabled = false; e.target.textContent = 'Confirmar importação'; }
  };
}

// ---------- fatura em PDF ----------

const DINHEIRO_BR = /^R\$\s*-?\d{1,3}(\.\d{3})*,\d{2}$/;
// "28/10" vira data completa pelo vencimento do cartão no app (mês depois do vencimento é do ano anterior).
function dataDe(ddmm, ref) {
  const [d, mm] = ddmm.split('/').map(Number);
  const a = Number(ref.slice(0, 4)) - (mm > Number(ref.slice(5, 7)) ? 1 : 0);
  return `${a}-${String(mm).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function lerFaturaPDF(itens, ref) {
  const tudo = itens.map(i => i.s).join(' ');
  if (/ourocard|bb\.com\.br/i.test(tudo) && /lançamentos nesta fatura/i.test(tudo)) return lerFaturaBB(itens, ref);
  throw new Error('Ainda não sei ler a fatura desse banco em PDF.');
}

// BB (Ourocard): "Lançamentos nesta fatura" em grupos do próprio BB (Saúde, Transporte, Compras parceladas...),
// cada linha com data, descrição, país e valor; "SALDO FATURA ANTERIOR" sem data; "Total da Fatura" no fim.
// A categoria vem das regras do app; se elas não souberem (Outros), usa o grupo do BB quando ele existe aqui.
const GRUPOS_BB = { 'saúde': 'Saúde', 'transporte': 'Transporte', 'supermercados': 'Mercado', 'educação': 'Educação', 'restaurantes': 'Lazer', 'lazer': 'Lazer', 'viagens': 'Viagens', 'turismo': 'Viagens' };
function lerFaturaBB(itens, ref) {
  const L = linhasPDF(itens);
  const linhas = [], avisos = [];
  let dentro = false, grupo = '', total = null, fecha = '';
  for (const l of L) {
    const t = l.texto;
    let m = t.match(/fatura fechada em (\d{2})\/(\d{2})\/(\d{4})/i);
    if (m) fecha = `${m[3]}-${m[2]}-${m[1]}`;
    if (/^lançamentos nesta fatura/i.test(t)) { dentro = true; continue; }
    if (!dentro) continue;
    const ult = l.itens[l.itens.length - 1].s.trim();
    if (/^total da fatura/i.test(t)) { total = numero(ult); break; }
    if (!DINHEIRO_BR.test(ult)) { if (l.itens.length <= 2 && !/^(data\b|página \d)/i.test(t)) grupo = t.toLowerCase(); continue; }
    const valor = numero(ult);
    const desc = l.itens.filter(i => i.x >= 75 && i.x < 440).map(i => i.s).join(' ').replace(/\s+/g, ' ').trim();
    if (/^saldo fatura anterior/i.test(desc)) { linhas.push({ data: fecha || ref, descricao: 'Saldo fatura anterior', parcela: '', tipo: 'saldo', categoria: '', valor }); continue; }
    const d = l.itens[0].s.trim();
    if (!/^\d{2}\/\d{2}$/.test(d)) { avisos.push('Linha que não entendi: ' + t); continue; }
    const p = desc.match(/\bPARC (\d{2})\/(\d{2})\b/i);
    const descricao = (p ? desc.replace(p[0], ' ') : desc).replace(/\s+/g, ' ').trim();
    const tipo = /pagamentos/i.test(grupo) && valor < 0 ? (/pgto|pagamento/i.test(descricao) ? 'pagamento' : 'estorno') : valor < 0 ? 'estorno' : 'compra';
    let categoria = tipo === 'pagamento' ? '' : categoriaDe(descricao);
    if (categoria === 'Outros' && GRUPOS_BB[grupo]) categoria = GRUPOS_BB[grupo];
    linhas.push({ data: dataDe(d, ref), descricao, parcela: p ? `${Number(p[1])}/${Number(p[2])}` : '', tipo, categoria, valor });
  }
  if (total === null) throw new Error('Não achei o "Total da Fatura" no PDF do BB.');
  if (L.filter(l => /\(cartão \d{4}\)/i.test(l.texto)).length > 1) avisos.push('A fatura tem mais de um cartão (adicional); as compras entram todas juntas.');
  return { banco: 'BB', linhas, total, avisos };
}

// O pdf.js é carregado só quando precisa e lê o arquivo no próprio aparelho; senha e arquivo não vão para o servidor.
let pdfjs = null;
async function abrirPDF(dados, senha) {
  if (!pdfjs) {
    pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  }
  const doc = await pdfjs.getDocument({ data: dados, password: senha }).promise;
  const itens = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const c = await (await doc.getPage(p)).getTextContent();
    c.items.forEach(it => { if (it.str.trim()) itens.push({ p, x: it.transform[4], y: it.transform[5], s: it.str }); });
  }
  return itens;
}

// Abre o PDF; se pedir senha, pergunta e tenta de novo. seguir(itens) recebe o texto; voltar() é o botão Voltar.
async function lerPDFcomSenha(f, senha, seguir, voltar) {
  toast('Lendo o PDF…');
  try { seguir(await abrirPDF(new Uint8Array(await f.arrayBuffer()), senha)); }
  catch (err) {
    if (!err || err.name !== 'PasswordException') return erro(err);
    abrirFolha(`
      <h3>PDF com senha</h3>
      <div class="sub">${esc(f.name)}</div>
      ${err.code === 2 ? '<div class="alerta">Senha incorreta.</div>' : ''}
      <div class="campo"><label>Senha do PDF. Ela não é gravada em lugar nenhum.</label><input id="senhaPdf" type="password" autocomplete="off"></div>
      <button class="btn pri" id="bSenha">Abrir</button>
      <button class="btn" id="bVoltar">Voltar</button>`);
    $('bVoltar').onclick = voltar;
    $('bSenha').onclick = e => { e.target.disabled = true; lerPDFcomSenha(f, $('senhaPdf').value, seguir, voltar); };
  }
}

// Junta os pedaços de texto em linhas (mesma página e mesma altura), da esquerda para a direita.
function linhasPDF(itens) {
  const L = [];
  itens.slice().sort((a, b) => a.p - b.p || b.y - a.y || a.x - b.x).forEach(it => {
    const l = L[L.length - 1];
    if (l && l.p === it.p && Math.abs(l.y - it.y) < 2) l.itens.push(it); else L.push({ p: it.p, y: it.y, itens: [it] });
  });
  L.forEach(l => { l.itens.sort((a, b) => a.x - b.x); l.texto = l.itens.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim(); });
  return L;
}

// ---------- extrato do C6 ----------

// Extrato da conta exportado pelo app do C6: data da transação, data de processamento, tipo, descrição e valor por linha.
// Confere a soma das entradas e saídas com o cabeçalho de cada mês do extrato.
function lerExtratoC6(itens) {
  const L = linhasPDF(itens);
  const tudo = L.map(l => l.texto).join('\n');
  if (!/C6 Bank/i.test(tudo) || !/Extrato da conta/i.test(tudo)) throw new Error('Não reconheci o PDF. Use o extrato da conta exportado pelo app do C6.');
  const per = tudo.match(/(\d{2})\/(\d{2})\/(\d{4}) a (\d{2})\/(\d{2})\/(\d{4})/);
  if (!per) throw new Error('Não achei o período do extrato.');
  const ini = `${per[3]}-${per[2]}-${per[1]}`, fim = `${per[6]}-${per[5]}-${per[4]}`;
  const ano = mm => (Number(mm) >= Number(ini.slice(5, 7)) ? ini.slice(0, 4) : fim.slice(0, 4));
  const linhas = [];
  for (const l of L) {
    const s = l.itens.map(i => i.s.trim());
    if (s.length < 5 || !/^\d{2}\/\d{2}$/.test(s[0]) || !/^-?R\$/.test(s[s.length - 1])) continue;
    const [d, mm] = s[0].split('/');
    linhas.push({ data: `${ano(mm)}-${mm}-${d}`, tipo: s[2], descricao: s.slice(3, -1).join(' '), valor: numero(s[s.length - 1]) });
  }
  const cab = [...tudo.matchAll(/Entradas:\s*R\$\s*([\d.,]+)\s*•\s*Saídas:\s*R\$\s*([\d.,]+)/g)];
  const soma = f => Math.round(linhas.filter(f).reduce((t, l) => t + l.valor, 0) * 100) / 100;
  const ent = soma(l => l.valor > 0), sai = -soma(l => l.valor < 0);
  const confere = cab.length > 0 && Math.abs(cab.reduce((t, c) => t + numero(c[1]), 0) - ent) < 0.01 && Math.abs(cab.reduce((t, c) => t + numero(c[2]), 0) - sai) < 0.01;
  return { ini, fim, linhas, ent, sai, confere };
}

// Casa cada linha do extrato com um lançamento do mesmo valor, despesa com saída e receita em reais com entrada,
// com vencimento a até 20 dias da data; vale o mais próximo e cada lançamento casa uma vez só.
const diasEntre = (a, b) => Math.abs(new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5;
function casarExtrato(linhas) {
  const usados = new Set();
  return linhas.map(e => {
    const tipo = e.valor < 0 ? 'Despesa' : 'Receita';
    const cand = st.itens.filter(i => i.tipo === tipo && i.moeda !== 'USD' && !usados.has(i.id) && /^\d{4}-\d{2}-\d{2}/.test(i.vencimento || '')
      && Math.abs(Number(i.valor_brl) - Math.abs(e.valor)) < 0.011 && diasEntre(i.vencimento, e.data) <= 20)
      .sort((a, b) => diasEntre(a.vencimento, e.data) - diasEntre(b.vencimento, e.data));
    if (cand[0]) usados.add(cand[0].id);
    return { e, i: cand[0] || null };
  });
}

function previaExtrato(x, arquivo) {

    <div class="bloco">A marcar como pago (${marcar.length})</div>

    <div class="bloco">Não identificados (${sem.length})</div>
    ${sem.length ? `<details class="compras"><summary>Ver as ${sem.length} linhas sem lançamento</summary>${sem.map(p => `<div>${linhaE(p.e)}</div>`).join('')}</details>` : ''}
    <button class="btn pri" id="bConc" ${marcar.length ? '' : 'disabled'}>Marcar como pago</button>
